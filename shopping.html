<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>網購管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<style>
.status-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:50px;font-size:.68rem;font-weight:700;white-space:nowrap}
.s-pending  {background:rgba(251,191,36,.14);color:var(--warn)}
.s-paid     {background:rgba(79,142,247,.14);color:var(--blue)}
.s-shipping {background:rgba(6,182,212,.14);color:#06b6d4}
.s-arrive   {background:rgba(244,63,94,.14);color:var(--danger);animation:pulse 1.2s infinite}
.s-done     {background:rgba(34,197,94,.14);color:var(--ok)}
.s-cancel   {background:var(--card2);color:var(--t3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.order-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:.18s}
.order-card:active{background:var(--card2)}
.order-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px}
.order-title{font-size:.95rem;font-weight:700;flex:1}
.order-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.order-tag{background:var(--bg2);color:var(--t2);font-size:.67rem;padding:2px 8px;border-radius:5px}
.order-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.order-amt{font-size:1rem;font-weight:900;color:#ff6b82}
.order-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.oa-btn{padding:7px 13px;border-radius:50px;font-size:.75rem;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.18s}

.step-bar{display:flex;align-items:center;margin:10px 0}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.step-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;border:2px solid var(--border);background:var(--bg2)}
.step-dot.done{background:var(--p);border-color:var(--p);color:#000}
.step-dot.active{background:var(--warn);border-color:var(--warn);color:#000;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.step-line{flex:1;height:2px;background:var(--border)}
.step-line.done{background:var(--p)}
.step-lbl{font-size:.58rem;color:var(--t3);text-align:center;line-height:1.3}

.platform-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:50px;background:var(--card);border:1.5px solid var(--border);color:var(--t2);font-size:.8rem;font-weight:600;cursor:pointer;transition:.18s;font-family:inherit}
.platform-chip.on{background:var(--pdim);border-color:var(--p);color:var(--p)}
.platform-chip:active{transform:scale(.95)}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
.stat-box .v{font-size:1.3rem;font-weight:900}
.stat-box .l{font-size:.62rem;color:var(--t2);margin-top:2px}
</style>
</head>
<body>
<header class="hdr">
  <div><h1>🛒 網購管理</h1><div class="hdr-sub" id="order-count">載入中...</div></div>
  <a href="./settings.html" class="hdr-btn">⚙️</a>
</header>

<div class="w">
  <!-- 統計 -->
  <div class="stats-row">
    <div class="stat-box"><div class="v" id="st-active">0</div><div class="l">進行中</div></div>
    <div class="stat-box"><div class="v" id="st-arrive" style="color:var(--danger)">0</div><div class="l">⚠️ 待取貨</div></div>
    <div class="stat-box"><div class="v" id="st-month">$0</div><div class="l">本月消費</div></div>
  </div>

  <!-- 一次性合併按鈕（合併後自動消失）-->
  <div id="migrate-bar" style="background:#f59e0b22;border:1.5px solid #f59e0b;border-radius:var(--rs);padding:10px 12px;margin-bottom:10px;display:none;align-items:center;justify-content:space-between;gap:8px">
    <span style="font-size:.8rem;color:#f59e0b;flex:1">首次使用共用網購：請合併兩人舊資料</span>
    <button id="btn-migrate" onclick="migrateOrdersToShared()" style="padding:6px 14px;background:#f59e0b;color:#000;border:none;border-radius:50px;font-weight:700;font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap">立即合併</button>
    <button onclick="dismissMigrateBar()" style="background:none;border:none;color:#f59e0b;font-size:1rem;cursor:pointer;padding:2px 4px">✕</button>
  </div>
  <!-- 篩選平台 -->
  <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px" id="platform-filter">
    <button class="platform-chip on" onclick="filterPlatform('',this)">全部</button>
  </div>

  <!-- 篩選狀態 -->
  <div class="pills" style="margin-bottom:12px">
    <button class="pill on" onclick="filterStatus('',this)">全部</button>
    <button class="pill" onclick="filterStatus('pending',this)">待付款</button>
    <button class="pill" onclick="filterStatus('paid',this)">已付款</button>
    <button class="pill" onclick="filterStatus('shipping',this)">運送中</button>
    <button class="pill" onclick="filterStatus('arrive',this)">待取貨</button>
    <button class="pill" onclick="filterStatus('done',this)">已完成</button>
  </div>

  <div id="order-list"></div>
  <div style="height:10px"></div>
</div>

<!-- 新增/編輯訂單 Modal -->
<div class="ov" id="order-modal">
  <div class="sheet" style="max-height:90dvh;overflow-y:auto">
    <div class="sh"></div>
    <div class="st" id="om-title">📦 新增網購訂單</div>

    <div class="fg">
      <span class="flbl">商品名稱 *</span>
      <input type="text" class="fc" id="om-name" placeholder="例：白色短袖上衣 3件" maxlength="50">
    </div>
    <div class="fg">
      <span class="flbl">購物平台 *</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="om-platforms"></div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
        <input type="text" class="fc" id="om-platform-custom" placeholder="輸入新平台名稱後按＋新增" style="font-size:.85rem;flex:1">
        <button onclick="addPlatform()" style="padding:9px 14px;background:var(--pdim);color:var(--p);border:1.5px solid var(--p);border-radius:var(--rs);font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem">＋</button>
      </div>
      <div style="font-size:.75rem;color:var(--t3);margin-bottom:4px">長按平台名稱可刪除（使用過的平台無法刪除）</div>
    </div>
    <div class="fg">
      <span class="flbl">賣家 / 團主（可略）</span>
      <input type="text" class="fc" id="om-seller" placeholder="例：媽媽群-阿花團購" maxlength="30">
    </div>
    <div class="fg">
      <span class="flbl">金額（可略）</span>
      <input type="number" class="fc" id="om-amt" placeholder="0" inputmode="numeric">
    </div>
    <div class="fg">
      <span class="flbl">訂單編號（可略）</span>
      <input type="text" class="fc" id="om-no" placeholder="例：231019-XXX" maxlength="40">
    </div>
    <div class="fg">
      <span class="flbl">取貨方式</span>
      <select class="fc" id="om-delivery">
        <option value="pickup">超商取貨</option>
        <option value="home">宅配到府</option>
        <option value="group">團購自取</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="fg">
      <span class="flbl">⏰ 取貨期限（可略）</span>
      <input type="date" class="fc" id="om-due" style="color-scheme:dark">
    </div>
    <div class="fg">
      <span class="flbl">備註（可略）</span>
      <input type="text" class="fc" id="om-note" placeholder="例：尺寸M，記得取貨" maxlength="60">
    </div>
    <div class="fg">
      <span class="flbl">狀態</span>
      <select class="fc" id="om-status">
        <option value="pending">待付款</option>
        <option value="paid">已付款</option>
        <option value="shipping">運送中</option>
        <option value="arrive">待取貨</option>
        <option value="done">已完成</option>
        <option value="cancel">已取消</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-s" onclick="closeModal('order-modal')">取消</button>
      <button class="btn btn-p" id="om-ok" onclick="submitOrder()">新增訂單</button>
    </div>
  </div>
</div>

<!-- 確認 Modal -->
<div class="ov" id="confirm-modal">
  <div class="sheet"><div class="sh"></div>
    <div class="st" id="cm-title"></div>
    <p id="cm-msg" style="color:var(--t2);font-size:.9rem;margin-bottom:18px;line-height:1.6"></p>
    <div class="btn-row">
      <button class="btn btn-s" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-d" id="cm-ok">確認</button>
    </div>
  </div>
</div>

<!-- 一鍵記帳 Modal -->
<div class="ov" id="bill-modal">
  <div class="sheet"><div class="sh"></div>
    <div class="st">💰 記帳這筆消費</div>
    <div style="font-size:.85rem;color:var(--t2);margin-bottom:12px;padding:10px 12px;background:var(--card2);border-radius:var(--rs);line-height:1.5" id="bm-info"></div>
    <div class="fg"><span class="flbl">💰 實際金額</span>
      <input type="number" class="fc" id="bm-amt" inputmode="numeric"></div>
    <div class="fg"><span class="flbl">📅 消費日期</span>
      <input type="datetime-local" class="fc" id="bm-dt"></div>
    <div class="fg"><span class="flbl">🏷️ 分類</span>
      <select class="fc" id="bm-cat"></select></div>
    <div class="fg"><span class="flbl">📂 子分類（可略）</span>
      <input type="text" class="fc" id="bm-subcat" placeholder="例：3C用品、衣服" maxlength="20"></div>
    <div class="fg"><span class="flbl">👤 記帳人</span>
      <div class="tg">
        <button class="tb" id="bm-p-hl" onclick="setBmPerson('宏龍',this)">🙋 宏龍</button>
        <button class="tb" id="bm-p-yh" onclick="setBmPerson('盈慧',this)">🙋‍♀️ 盈慧</button>
      </div>
    </div>
    <div class="fg"><span class="flbl">💳 付款方式</span>
      <div class="tg" style="flex-wrap:wrap;gap:8px">
        <button class="tb" id="bm-cash"  onclick="setBmPay('cash',this)"  style="flex:none;padding:10px 14px">💵 現金</button>
        <button class="tb" id="bm-card"  onclick="setBmPay('card',this)"  style="flex:none;padding:10px 14px">💳 信用卡</button>
        <button class="tb" id="bm-icard" onclick="setBmPay('icard',this)" style="flex:none;padding:10px 14px">🎫 悠遊卡</button>
      </div>
    </div>
    <div class="fg" id="bm-card-fg" style="display:none"><span class="flbl">🃏 選擇信用卡</span>
      <select class="fc" id="bm-card-sel"></select></div>
    <div class="fg" id="bm-icard-fg" style="display:none"><span class="flbl">🎫 選擇悠遊卡</span>
      <select class="fc" id="bm-icard-sel"></select></div>
    <div class="btn-row">
      <button class="btn btn-s" onclick="closeModal('bill-modal')">取消</button>
      <button class="btn btn-p" onclick="submitBill()">✅ 確認記帳</button>
    </div>
  </div>
</div>

<!-- FAB 新增按鈕 -->
<button onclick="showAddOrder()" style="position:fixed;bottom:calc(var(--nav)+16px);right:18px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#000;font-size:1.5rem;border:none;cursor:pointer;z-index:100;box-shadow:0 4px 18px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center">＋</button>

<nav class="nav">
  <a class="ni" href="./index.html"><span class="ic">📋</span><span>列表</span></a>
  <a class="ni" href="./report.html"><span class="ic">📊</span><span>報表</span></a>
  <a class="ni ni-add" href="./add.html"><div class="fab">➕</div></a>
  <a class="ni" href="./wallet.html"><span class="ic">👛</span><span>錢包</span></a>
  <a class="ni on" href="./shopping.html"><span class="ic">🛒</span><span>網購</span></a>
</nav>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="./js/auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./js/db.js"></script>
<script src="./js/firebase.js"></script>
<script src="./js/assistant.js"></script>
<script>
// ── 網購資料層 ────────────────────────────────────────
function getOrders()    { return DB.get('orders') || []; }
function saveOrders(l)  { DB.set('orders', l); }

const STATUS_MAP = {
  pending:  { label:'待付款', cls:'s-pending',  icon:'🕐' },
  paid:     { label:'已付款', cls:'s-paid',     icon:'💳' },
  shipping: { label:'運送中', cls:'s-shipping', icon:'🚚' },
  arrive:   { label:'待取貨', cls:'s-arrive',   icon:'📦' },
  done:     { label:'已完成', cls:'s-done',     icon:'✅' },
  cancel:   { label:'已取消', cls:'s-cancel',   icon:'❌' },
};
const STEPS = ['pending','paid','shipping','arrive','done'];
const DELIVERY_MAP = {pickup:'超商取貨', home:'宅配到府', group:'團購自取', other:'其他'};

let filterPlat='', filterStat='', editOrderId='', selPlatformName='';
let bmPay='cash', bmOrderId='';

function init() {
  applyTheme();
  render();
  checkDueReminders();
}

function render() {
  let list = getOrders();
  // 統計
  const active  = list.filter(o=>!['done','cancel'].includes(o.status)).length;
  const arrives = list.filter(o=>o.status==='arrive').length;
  const now = new Date();
  const monthAmt = list.filter(o=>{
    if(o.status==='cancel')return false;
    const d=new Date(o.createdAt||0);
    return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  }).reduce((s,o)=>s+(o.amount||0),0);
  document.getElementById('st-active').textContent = active;
  document.getElementById('st-arrive').textContent = arrives;
  document.getElementById('st-month').textContent  = '$'+fmt(monthAmt);
  document.getElementById('order-count').textContent = `共 ${list.length} 筆`;

  // 平台篩選按鈕
  const platforms = [...new Set(list.map(o=>o.platform).filter(Boolean))];
  const pfEl = document.getElementById('platform-filter');
  pfEl.innerHTML = `<button class="platform-chip${filterPlat===''?' on':''}" onclick="filterPlatform('',this)">全部</button>` +
    platforms.map(p=>`<button class="platform-chip${filterPlat===p?' on':''}" onclick="filterPlatform('${p}',this)">${p}</button>`).join('');

  // 篩選
  if (filterPlat) list = list.filter(o=>o.platform===filterPlat);
  if (filterStat) list = list.filter(o=>o.status===filterStat);
  list = [...list].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));

  const el = document.getElementById('order-list');
  if (!list.length) {
    el.innerHTML='<div class="empty"><div class="ei">🛒</div><p>尚無訂單<br>點右下角 ＋ 新增</p></div>';
    return;
  }
  el.innerHTML = list.map(o=>orderHTML(o)).join('');
}

function orderHTML(o) {
  const st = STATUS_MAP[o.status] || STATUS_MAP.pending;
  const now = new Date();
  const due = o.dueDate ? new Date(o.dueDate) : null;
  const overdue = due && due < now && o.status==='arrive';
  const dueStr = due ? `取貨期限：${fmtD(o.dueDate)}${overdue?'（<b style="color:var(--danger)">已超期！</b>）':diff(due,now)<=3?`（<b style="color:var(--warn)">剩${diff(due,now)}天</b>）`:''}` : '';

  // 進度條
  const curStep = STEPS.indexOf(o.status);
  const stepHTML = o.status!=='cancel' ? `
    <div class="step-bar">${STEPS.map((s,i)=>`
      ${i>0?`<div class="step-line${i<=curStep?' done':''}"></div>`:''}
      <div class="step">
        <div class="step-dot${i<curStep?' done':i===curStep?' active':''}">${i<curStep?'✓':i+1}</div>
        <div class="step-lbl">${STATUS_MAP[s].label}</div>
      </div>`).join('')}
    </div>` : '';

  return `<div class="order-card">
    <div class="order-hdr">
      <div class="order-title">${o.name}</div>
      <span class="status-badge ${st.cls}">${st.icon} ${st.label}</span>
    </div>
    <div class="order-meta">
      <span class="order-tag">🏪 ${o.platform||'未知平台'}</span>
      ${o.seller?`<span class="order-tag">👤 ${o.seller}</span>`:''}
      <span class="order-tag">${DELIVERY_MAP[o.delivery]||'其他'}</span>
      ${o.orderNo?`<span class="order-tag">📋 ${o.orderNo}</span>`:''}
    </div>
    ${stepHTML}
    ${dueStr?`<div style="font-size:.75rem;color:var(--t2);margin:4px 0">${dueStr}</div>`:''}
    ${o.note?`<div style="font-size:.78rem;color:var(--t3);margin-top:4px">📝 ${o.note}</div>`:''}
    <div class="order-footer">
      <span class="order-amt">${o.amount?'$'+fmt(o.amount):'金額未填'}</span>
      <span style="font-size:.68rem;color:var(--t3)">${o.createdAt?fmtD(o.createdAt):''}</span>
    </div>
    <div class="order-actions">
      ${nextStatusBtn(o)}
      <button class="oa-btn" style="background:var(--pdim);color:var(--p)" onclick="editOrder('${o.id}')">✏️ 編輯</button>
      ${o.status!=='cancel'&&!o.billed?`<button class="oa-btn" style="background:rgba(34,197,94,.15);color:var(--ok)" onclick="showBillOrder('${o.id}')">💰 轉為記帳</button>`:''}
      ${o.billed?`<span style="font-size:.72rem;color:var(--ok);display:inline-flex;align-items:center;gap:4px">✅ 已記帳<button class="oa-btn" style="background:rgba(34,197,94,.08);color:var(--ok);padding:4px 10px;font-size:.7rem;margin-left:4px" onclick="undoBill('${o.id}')">↩</button></span>`:''}
      <button class="oa-btn" style="background:rgba(244,63,94,.1);color:var(--danger)" onclick="confirmDel('${o.id}')">🗑️</button>
    </div>
  </div>`;
}

function nextStatusBtn(o) {
  const map = {pending:'已付款',paid:'運送中',shipping:'待取貨',arrive:'已完成'};
  const next = {pending:'paid',paid:'shipping',shipping:'arrive',arrive:'done'};
  if (!next[o.status]) return '';
  return `<button class="oa-btn" style="background:var(--pdim);color:var(--p);font-weight:900" onclick="advanceStatus('${o.id}')">→ ${map[o.status]}</button>`;
}

function diff(a, b) { return Math.ceil((a-b)/864e5); }

// ── 新增/編輯 ─────────────────────────────────────────
function showAddOrder() {
  editOrderId=''; selPlatformName='';
  renderPlatformChips();
  document.getElementById('om-title').textContent='📦 新增網購訂單';
  document.getElementById('om-ok').textContent='新增訂單';
  ['om-name','om-platform-custom','om-seller','om-no','om-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('om-amt').value='';
  document.getElementById('om-due').value='';
  document.getElementById('om-status').value='pending';
  document.getElementById('om-delivery').value='pickup';
  document.querySelectorAll('#om-platforms .platform-chip').forEach(b=>b.classList.remove('on'));
  showModal('order-modal');
}

function editOrder(id) {
  editOrderId=id;
  const o=getOrders().find(x=>x.id===id); if(!o)return;
  document.getElementById('om-title').textContent='✏️ 編輯訂單';
  document.getElementById('om-ok').textContent='儲存';
  document.getElementById('om-name').value=o.name||'';
  renderPlatformChips(o.platform||'');
  document.getElementById('om-platform-custom').value='';
  document.getElementById('om-seller').value=o.seller||'';
  document.getElementById('om-amt').value=o.amount||'';
  document.getElementById('om-no').value=o.orderNo||'';
  document.getElementById('om-note').value=o.note||'';
  document.getElementById('om-due').value=o.dueDate||'';
  document.getElementById('om-status').value=o.status||'pending';
  document.getElementById('om-delivery').value=o.delivery||'pickup';
  selPlatformName=o.platform||'';
  document.querySelectorAll('#om-platforms .platform-chip').forEach(b=>{
    b.classList.toggle('on', b.textContent===o.platform);
  });
  showModal('order-modal');
}

function submitOrder() {
  const name=document.getElementById('om-name').value.trim();
  if(!name){toast('請輸入商品名稱','warn');return;}
  const platform=selPlatformName||document.getElementById('om-platform-custom').value.trim()||'其他';
  const order = {
    id:       editOrderId || Date.now().toString(36)+Math.random().toString(36).slice(2,4),
    name, platform,
    seller:   document.getElementById('om-seller').value.trim(),
    amount:   parseInt(document.getElementById('om-amt').value)||0,
    orderNo:  document.getElementById('om-no').value.trim(),
    delivery: document.getElementById('om-delivery').value,
    dueDate:  document.getElementById('om-due').value,
    note:     document.getElementById('om-note').value.trim(),
    status:   document.getElementById('om-status').value,
    user:     currentUser(),
    createdAt: editOrderId ? (getOrders().find(x=>x.id===editOrderId)?.createdAt||new Date().toISOString()) : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    billed:   editOrderId ? (getOrders().find(x=>x.id===editOrderId)?.billed||false) : false,
  };
  const list=getOrders();
  if(editOrderId){const idx=list.findIndex(x=>x.id===editOrderId);if(idx>=0)list[idx]=order;else list.unshift(order);}
  else list.unshift(order);
  saveOrders(list);
  fbSyncOrders();
  closeModal('order-modal');render();
  toast(editOrderId?'已儲存修改':'訂單已新增！');
}

function advanceStatus(id) {
  const next={pending:'paid',paid:'shipping',shipping:'arrive',arrive:'done'};
  const list=getOrders(),idx=list.findIndex(x=>x.id===id);if(idx<0)return;
  list[idx].status=next[list[idx].status]||list[idx].status;
  list[idx].updatedAt=new Date().toISOString();
  saveOrders(list);fbSyncOrders();render();
  toast('狀態已更新：'+STATUS_MAP[list[idx].status].label);
}

function confirmDel(id) {
  const o=getOrders().find(x=>x.id===id);
  document.getElementById('cm-title').textContent='刪除訂單';
  document.getElementById('cm-msg').textContent=`確定刪除「${o?.name||''}」？`;
  showModal('confirm-modal');
  document.getElementById('cm-ok').onclick=()=>{
    saveOrders(getOrders().filter(x=>x.id!==id));
    fbSyncOrders();closeModal('confirm-modal');render();toast('已刪除','err');
  };
}

// ── 一鍵記帳 ─────────────────────────────────────────
let bmPerson = '宏龍';

function showBillOrder(id) {
  bmOrderId = id;
  bmPay = 'cash';
  const o = getOrders().find(x=>x.id===id);
  if (!o) return;

  // 訂單資訊
  document.getElementById('bm-info').innerHTML =
    `<b style="color:var(--t)">${o.name}</b><br>` +
    `<span style="font-size:.78rem">📦 ${o.platform || '無平台'}${o.orderNo ? ' · 單號 '+o.orderNo : ''}</span>`;

  // 金額
  document.getElementById('bm-amt').value = o.amount || '';

  // 預設日期 = 訂單日（or 今天）
  const defaultDate = o.orderDate || new Date().toISOString().slice(0,10);
  const dt = new Date(defaultDate + 'T12:00:00');
  document.getElementById('bm-dt').value = new Date(dt.getTime() - dt.getTimezoneOffset()*60000).toISOString().slice(0,16);

  // 分類選單，預設「購物」（id='shopping' 或第一個有 shopping 字眼的）
  const catSel = document.getElementById('bm-cat');
  const cats = getCats();
  const defaultCat = cats.find(c=>c.id==='shopping') || cats.find(c=>c.name.includes('購物')) || cats[0];
  catSel.innerHTML = cats.map(c =>
    `<option value="${c.id}" ${c.id===defaultCat?.id?'selected':''}>${c.name}</option>`
  ).join('');

  // 子分類預設「網購」
  document.getElementById('bm-subcat').value = '網購';

  // 記帳人預設目前登入者
  bmPerson = currentUser() || '宏龍';
  document.getElementById('bm-p-hl').classList.toggle('on', bmPerson==='宏龍');
  document.getElementById('bm-p-yh').classList.toggle('on', bmPerson==='盈慧');

  // 信用卡選單（含對方共用）
  const cardSel = document.getElementById('bm-card-sel');
  const allCards = typeof getAllAvailableCards==='function' ? getAllAvailableCards() : getCards().map(c=>({...c,_owner:'我的'}));
  cardSel.innerHTML = allCards.map(c =>
    `<option value="${c.id}">${c.name} ···${c.last4}${c._owner!=='我的'?' ('+c._owner+')':''}</option>`
  ).join('') || '<option value="">尚無信用卡</option>';

  // 悠遊卡選單
  const icardSel = document.getElementById('bm-icard-sel');
  const allIcards = typeof getAllAvailableIcards==='function' ? getAllAvailableIcards() : getIcards().map(c=>({...c,_owner:'我的'}));
  icardSel.innerHTML = allIcards.map(c =>
    `<option value="${c.id}">${c.name}${c._owner!=='我的'?' ('+c._owner+')':''}</option>`
  ).join('') || '<option value="">尚無悠遊卡</option>';

  // 重設付款按鈕
  ['cash','card','icard'].forEach(p => {
    document.getElementById('bm-'+p).classList.toggle('on', p==='cash');
  });
  document.getElementById('bm-card-fg').style.display = 'none';
  document.getElementById('bm-icard-fg').style.display = 'none';

  showModal('bill-modal');
}

function setBmPerson(p, el) {
  bmPerson = p;
  document.querySelectorAll('#bm-p-hl,#bm-p-yh').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}

function setBmPay(p, el) {
  bmPay = p;
  document.querySelectorAll('#bm-cash,#bm-card,#bm-icard').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('bm-card-fg').style.display  = p==='card'  ? 'block' : 'none';
  document.getElementById('bm-icard-fg').style.display = p==='icard' ? 'block' : 'none';
}

async function submitBill() {
  const amt = parseInt(document.getElementById('bm-amt').value) || 0;
  if (!amt) { toast('請輸入金額', 'warn'); return; }

  const o = getOrders().find(x=>x.id===bmOrderId);
  if (!o) return;

  // 從 modal 收集所有資料
  const dtv      = document.getElementById('bm-dt').value;
  const at       = dtv ? new Date(dtv).toISOString() : new Date().toISOString();
  const cat      = document.getElementById('bm-cat').value;
  const subCat   = document.getElementById('bm-subcat').value.trim();
  const cardId   = bmPay === 'card'  ? (document.getElementById('bm-card-sel').value  || null) : null;
  const icardId  = bmPay === 'icard' ? (document.getElementById('bm-icard-sel').value || null) : null;

  const tx = {
    amount: amt,
    cat,
    subCat,
    detail: o.name,
    person: bmPerson,
    pay:    bmPay,
    cardId,
    icardId,
    at,
    fromOrder: o.id,  // 記錄來源訂單，方便追蹤
  };

  // 加入記帳（這會自動處理現金/悠遊卡/信用卡的扣款）
  const newTx = addTx(tx);
  await fbAddTx(newTx || tx);

  // 標記訂單已記帳，並記錄對應的 tx id（供 undo 使用）
  const list = getOrders();
  const idx  = list.findIndex(x=>x.id===bmOrderId);
  if (idx >= 0) {
    list[idx].billed = true;
    list[idx].billedTxId = (newTx && newTx.id) || null;
    saveOrders(list);
    fbSyncOrders();
  }

  closeModal('bill-modal');
  render();
  toast(`✅ 已記帳 $${fmt(amt)}`);
}

// 撤銷已記帳：刪除對應的 tx，並把訂單標記恢復
function undoBill(orderId) {
  const list = getOrders();
  const idx  = list.findIndex(x=>x.id===orderId);
  if (idx < 0) return;
  const order = list[idx];
  if (!order.billed) return;
  if (!confirm(`要撤銷「${order.name}」的記帳嗎？對應的記帳記錄會被刪除。`)) return;

  // 刪除對應的 tx（如果有 ID 紀錄）
  if (order.billedTxId && typeof delTx === 'function') {
    delTx(order.billedTxId);
    if (typeof fbDelTx === 'function') fbDelTx(order.billedTxId);
  }
  // 重置訂單狀態
  order.billed = false;
  order.billedTxId = null;
  saveOrders(list);
  fbSyncOrders();
  render();
  toast('已撤銷記帳');
}

// ── 到期提醒 ─────────────────────────────────────────
function checkDueReminders(){
  const now=new Date();
  const warning=getOrders().filter(o=>{
    if(o.status!=='arrive'||!o.dueDate)return false;
    const due=new Date(o.dueDate);
    return diff(due,now)<=2;
  });
  if(warning.length){
    setTimeout(()=>toast(`⚠️ ${warning.length} 筆訂單取貨期限快到！`,'warn'),1000);
  }
}

// ── Firebase 同步 ─────────────────────────────────────
async function fbSyncOrders(){
  try{
    await getDb().collection('shared').doc('orders').set({list:getOrders(),updatedAt:Date.now()});
  }catch(e){console.warn('[FB]orders',e);}
}
async function fbPullOrders(){
  try{
    const d=await getDb().collection('shared').doc('orders').get();
    if(d.exists&&d.data().list){DB.set('orders',d.data().list);}
  }catch(e){}
}

// ── 平台雲端同步 ─────────────────────────────────────
async function fbSyncPlatforms(){
  try{
    await getDb().collection('shared').doc('platforms').set({list:getPlatforms(),updatedAt:Date.now()});
  }catch(e){}
}
async function fbPullPlatforms(){
  try{
    const d=await getDb().collection('shared').doc('platforms').get();
    if(d.exists&&d.data().list&&d.data().list.length){
      DB.set('platforms',d.data().list);
    }
  }catch(e){}
}
let _platformsUnsub=null;
function fbListenPlatforms(){
  if(_platformsUnsub) _platformsUnsub();
  try{
    _platformsUnsub=getDb().collection('shared').doc('platforms')
      .onSnapshot(snap=>{
        if(snap.exists&&snap.data().list&&snap.data().list.length){
          DB.set('platforms',snap.data().list);
        }
      });
  }catch(e){}
}

// 登入時把自己的 uid 寫到 shared/users，供合併使用
async function registerUserUid(){
  try{
    const myUid=uid();
    if(!myUid) return;
    const ref=getDb().collection('shared').doc('users');
    const d=await ref.get();
    const map=(d.exists&&d.data().uids)||{};
    const user=firebase.auth().currentUser;
    if(user){ map[user.email]=myUid; await ref.set({uids:map,updatedAt:Date.now()}); }
  }catch(e){}
}
let _ordersUnsub=null;
function fbListenOrders(){
  if(_ordersUnsub) _ordersUnsub();
  try{
    _ordersUnsub=getDb().collection('shared').doc('orders')
      .onSnapshot(snap=>{
        if(snap.exists&&snap.data().list){
          DB.set('orders',snap.data().list);
          render();
        }
      });
  }catch(e){console.warn('[FB]listen orders',e);}
}

// ── 平台管理 ────────────────────────────────────────
const DEFAULT_PLATFORMS = ['蝦皮','momo','LINE群組','臉書','酷朋','Yahoo','團購','其他'];
function getPlatforms() {
  const saved = DB.get('platforms');
  return saved && saved.length ? saved : [...DEFAULT_PLATFORMS];
}
function savePlatforms(list) { DB.set('platforms', list); }
function getUsedPlatforms() {
  return new Set(getOrders().map(o=>o.platform).filter(Boolean));
}
function renderPlatformChips(selected='') {
  const el = document.getElementById('om-platforms');
  if(!el) return;
  const used = getUsedPlatforms();
  el.innerHTML = getPlatforms().map(p => {
    const isUsed = used.has(p);
    return `<button class="platform-chip${p===selected?' on':''}"
      onclick="selPlatform('${p}',this)"
      oncontextmenu="delPlatform(event,'${p}')"
      ontouchstart="startLongPress('${p}',this)" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()"
      style="position:relative">${p}${isUsed?'':' <span style=\'font-size:.7rem;opacity:.5\'></span>'}</button>`;
  }).join('');
}
function selPlatform(name, el) {
  selPlatformName=name;
  document.querySelectorAll('#om-platforms .platform-chip').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('om-platform-custom').value='';
}
function addPlatform() {
  const input = document.getElementById('om-platform-custom');
  const name = input.value.trim();
  if(!name){ toast('請輸入平台名稱','warn'); return; }
  const list = getPlatforms();
  if(list.includes(name)){ toast('平台已存在','warn'); return; }
  list.splice(list.length-1, 0, name); // 插在「其他」前面
  savePlatforms(list);
  fbSyncPlatforms();
  input.value='';
  renderPlatformChips(name);
  selPlatformName=name;
  toast(`已新增平台「${name}」`);
}
function delPlatform(e, name) {
  e.preventDefault();
  if(getUsedPlatforms().has(name)){ toast(`「${name}」有訂單記錄，無法刪除`,'warn'); return; }
  if(!confirm(`確定刪除平台「${name}」？`)){ return; }
  savePlatforms(getPlatforms().filter(p=>p!==name));
  fbSyncPlatforms();
  renderPlatformChips();
  toast(`已刪除「${name}」`);
}
let _lpTimer=null;
function startLongPress(name, el) {
  cancelLongPress();
  _lpTimer = setTimeout(()=>{ delPlatform({preventDefault:()=>{}}, name); }, 700);
}
function cancelLongPress() { clearTimeout(_lpTimer); _lpTimer=null; }

function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}

let _tt;
function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(type?' '+type:'');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2800);}

// ── 一次性資料合併（把兩人舊資料搬到 shared/orders）──
function dismissMigrateBar(){
  localStorage.setItem('migrate_dismissed','1');
  document.getElementById('migrate-bar')?.remove();
}

async function migrateOrdersToShared(){
  const btn=document.getElementById('btn-migrate');
  if(btn){ btn.disabled=true; btn.textContent='合併中...'; }
  try{
    const db=getDb(), myUid=uid();
    // 讀自己舊資料
    const myDoc=await db.collection('orders').doc(myUid).get();
    const myList=myDoc.exists&&myDoc.data().list?myDoc.data().list:[];
    // 從 shared/users 讀所有已登入過的 uid
    let otherList=[];
    try{
      const usersDoc=await db.collection('shared').doc('users').get();
      const uidsMap=(usersDoc.exists&&usersDoc.data().uids)||{};
      for(const [email,uid2] of Object.entries(uidsMap)){
        if(uid2!==myUid){
          const d=await db.collection('orders').doc(uid2).get();
          if(d.exists&&d.data().list) otherList=otherList.concat(d.data().list);
        }
      }
    }catch(e){ console.warn('讀對方資料失敗',e); }
    // 也嘗試讀現有 shared/orders（避免蓋掉已同步的）
    let sharedList=[];
    try{
      const sd=await db.collection('shared').doc('orders').get();
      if(sd.exists&&sd.data().list) sharedList=sd.data().list;
    }catch(e){}
    // 三方合併去重（以 id 為主，沒有 id 的也保留）
    const seen=new Set(); const merged=[];
    [...sharedList,...myList,...otherList].forEach(o=>{
      if(o.id){ if(!seen.has(o.id)){seen.add(o.id);merged.push(o);} }
      else { merged.push(o); }
    });
    merged.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    await db.collection('shared').doc('orders').set({list:merged,updatedAt:Date.now()});
    DB.set('orders',merged);
    localStorage.setItem('orders_migrated','1');
    localStorage.removeItem('migrate_dismissed');
    render();
    toast(`✅ 合併完成！共 ${merged.length} 筆訂單`);
    document.getElementById('migrate-bar')?.remove();
  }catch(e){
    toast('合併失敗：'+e.message,'err');
    if(btn){ btn.disabled=false; btn.textContent='立即合併'; }
  }
}

window.addEventListener('DOMContentLoaded',()=>setTimeout(async ()=>{
  init();
  // 把自己 uid 寫到 shared/users（供合併使用）
  await registerUserUid();
  // 拉平台清單
  await fbPullPlatforms();
  fbListenPlatforms();
  // 拉訂單
  await fbPullOrders();
  render();
  fbListenOrders();
  // 沒有合併記錄且沒有關閉記錄才顯示合併欄
  if(!localStorage.getItem('orders_migrated') && !localStorage.getItem('migrate_dismissed')){
    const bar = document.getElementById('migrate-bar');
    if(bar) bar.style.display = 'flex';
  }
},150));
</script>
