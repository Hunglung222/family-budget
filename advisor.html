<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<link rel="manifest" href="./manifest.json">
<title>阿錢 · 你的財務夥伴</title>
<link rel="stylesheet" href="./css/style.css">
<style>
/* ── 阿錢專屬頁：沉穩、人類顧問質感，與全 App 暗色系一致 ── */
body { padding-bottom: calc(var(--nav) + env(safe-area-inset-bottom,0px)); }

/* 顧問形象區（hero）：阿錢頭像 + 階段 + 今日一句話 */
.adv-hero {
  background: linear-gradient(155deg, rgba(0,229,180,.10), rgba(0,180,142,.04) 55%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 16px 16px;
  margin: 14px 0 12px;
}
.adv-top { display:flex; align-items:center; gap:13px; }
.adv-ava {
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  background: linear-gradient(135deg, #2a3550, #1a2235);
  border:1.5px solid rgba(0,229,180,.4);
  display:flex; align-items:center; justify-content:center; font-size:1.7rem;
  box-shadow: 0 3px 14px rgba(0,0,0,.3);
}
.adv-name { font-size:1.08rem; font-weight:900; color:var(--t); }
.adv-role { font-size:.7rem; color:var(--t2); margin-top:2px; }
.adv-stage {
  display:inline-flex; align-items:center; gap:5px;
  margin-top:7px; padding:4px 11px; border-radius:50px;
  background: var(--card2); border:1px solid var(--border);
  font-size:.68rem; font-weight:800; color:var(--p);
}
/* 今日一句話 */
.adv-daily {
  margin-top:14px; padding:12px 14px;
  background: var(--card); border:1px solid var(--border);
  border-radius: 14px 14px 14px 4px;
  font-size:.86rem; line-height:1.6; color:var(--t);
  position:relative;
}
.adv-daily-lbl { font-size:.62rem; font-weight:900; color:var(--p); letter-spacing:.08em; text-transform:uppercase; margin-bottom:5px; }
.adv-daily.loading { color:var(--t2); font-style:italic; }

/* 對話區 */
.chat-scroll { padding: 4px 2px 8px; }
.bub-row { display:flex; align-items:flex-end; gap:8px; margin-bottom:12px; }
.bub-row.me { flex-direction: row-reverse; }
.bub-ava {
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:1.05rem;
  background: linear-gradient(135deg, #2a3550, #1a2235); border:1px solid rgba(0,229,180,.35);
}
.bub-row.me .bub-ava { background:var(--card2); border:1px solid var(--border); }
.bub {
  max-width: calc(100% - 52px);
  padding:10px 14px; font-size:.94rem; line-height:1.66;
  border-radius:16px 16px 16px 4px;
  background:var(--card); border:1.5px solid var(--border); color:var(--t);
  white-space:pre-wrap; word-break:break-word;
}
.bub-row.me .bub {
  border-radius:16px 16px 4px 16px;
  background: var(--pdim); border-color: rgba(0,229,180,.35); color:var(--t);
}
.bub.typing { color:var(--t2); }
.dots span { display:inline-block; animation: blink 1.4s infinite both; }
.dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

/* 快速提問 chips */
.quick-wrap { display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; }
.quick-wrap::-webkit-scrollbar { display:none; }
.quick {
  flex-shrink:0; padding:7px 13px; border-radius:50px;
  background:var(--card); border:1.5px solid var(--border); color:var(--t2);
  font-size:.76rem; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;
}
.quick:active { background:var(--card2); }

/* 轉介卡（老余 / 鐵衛） */
.handoff { display:flex; gap:8px; margin:2px 0 12px; }
.handoff a {
  flex:1; text-decoration:none; padding:10px; border-radius:12px;
  background:var(--card); border:1px solid var(--border); text-align:center;
}
.handoff .ho-emoji { font-size:1.3rem; }
.handoff .ho-name { font-size:.72rem; font-weight:800; color:var(--t); margin-top:2px; }
.handoff .ho-desc { font-size:.6rem; color:var(--t3); margin-top:1px; }

/* 輸入列（固定在 nav 上方） */
.adv-input-bar {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom: calc(var(--nav) + env(safe-area-inset-bottom,0px));
  width:100%; max-width:480px; z-index:120;
  display:flex; gap:8px; align-items:flex-end;
  padding:10px 12px; background:var(--bg2); border-top:1px solid var(--border);
}
.adv-input-bar textarea {
  flex:1; resize:none; max-height:96px; min-height:42px;
  padding:11px 14px; border-radius:14px;
  background:var(--card); border:1.5px solid var(--border); color:var(--t);
  font-size:.9rem; font-family:inherit; line-height:1.4;
}
.adv-input-bar textarea:focus { outline:none; border-color:var(--p); }
.adv-send {
  flex-shrink:0; width:42px; height:42px; border-radius:50%;
  background:linear-gradient(135deg,var(--p),var(--p2)); border:none; color:#06281f;
  font-size:1.15rem; cursor:pointer; font-family:inherit;
}
.adv-send:disabled { opacity:.45; }
/* 附件按鈕 + 預覽 */
.adv-attach-btn {
  flex-shrink:0; width:42px; height:42px; border-radius:50%;
  background:var(--card); border:1.5px solid var(--border); color:var(--t2);
  font-size:1.15rem; cursor:pointer; font-family:inherit;
}
.adv-attach-btn:active { background:var(--card2); }
.adv-attach-preview {
  position:absolute; left:12px; right:12px; top:-52px;
  display:flex; gap:8px; overflow-x:auto; padding:2px 0; -webkit-overflow-scrolling:touch;
}
.adv-attach-preview::-webkit-scrollbar { display:none; }
.att-chip {
  display:flex; align-items:center; gap:7px; flex-shrink:0;
  background:var(--card); border:1.5px solid var(--p); border-radius:10px;
  padding:6px 9px; font-size:.74rem; color:var(--t); max-width:200px;
}
.att-chip img { width:26px; height:26px; border-radius:5px; object-fit:cover; flex-shrink:0; }
.att-chip .att-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.att-chip .att-x { cursor:pointer; color:var(--t3); font-weight:900; flex-shrink:0; padding:0 2px; }
/* 使用者泡泡裡的附件呈現 */
.bub .bub-att { margin-top:6px; font-size:.78rem; opacity:.85; display:flex; align-items:center; gap:6px; }
.bub .bub-att img { max-width:160px; max-height:160px; border-radius:8px; display:block; margin-top:4px; }
.no-key-tip {
  background: rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.4);
  color:var(--warn); border-radius:12px; padding:11px 13px; font-size:.78rem; line-height:1.5; margin:8px 0;
}
</style>
</head>
<body>
<header class="hdr">
  <div>
    <h1 style="font-size:1.1rem;margin:0">💰 阿錢</h1>
    <div class="hdr-sub">你的財務夥伴</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button onclick="openHistoryPanel()" class="mbtn" title="對話歷史" style="font-size:.95rem">📜</button>
    <button onclick="openMemoryPanel()" class="mbtn" title="阿錢記得什麼" style="font-size:.95rem">🧠</button>
    <button onclick="goSettingsWithSnapshot()" class="mbtn" title="設定" style="font-size:.95rem">⚙️</button>

</header>

<div class="w">

  <div class="adv-hero">
    <div class="adv-top">
      <div class="adv-ava">💰</div>
      <div style="flex:1">
        <div class="adv-name">阿錢</div>

        <div class="adv-stage" id="adv-stage">📍 載入中…</div>

    </div>

      <span id="adv-daily-text">阿錢正在看你們最近的記帳…</span>
    </div>
  </div>

  <!-- 轉介專家 -->
  <div class="handoff">
    <a href="./invest.html"><div class="ho-emoji">🦁</div><div class="ho-name">老余</div><div class="ho-desc">投資配置</div></a>
    <a href="./trade.html"><div class="ho-emoji">🤖</div><div class="ho-name">鐵衛</div><div class="ho-desc">交易紀律</div></a>
    <a href="./report.html"><div class="ho-emoji">📊</div><div class="ho-name">報表</div><div class="ho-desc">收支圖表</div></a>
  </div>

  <!-- 成長軌跡（里程碑時間軸）-->
  <div id="adv-journey" style="display:none;margin-bottom:14px">

      <div style="font-size:.82rem;font-weight:900;color:var(--t)">🌱 我們走過的路</div>
      <span id="journey-caret" style="color:var(--t3);font-size:.85rem">展開 ▾</span>

    <div id="journey-body" style="display:none"></div>

  <div style="height:64px"></div>
</div>

<!-- 🧠 阿錢記得什麼（可查看/編輯）-->
<div class="ov" id="memory-modal">
  <div class="sheet" style="max-height:90dvh;overflow-y:auto">
    <div class="sh"></div>
    <div class="st" style="margin-bottom:4px">🧠 阿錢記得什麼</div>
    <div style="font-size:.74rem;color:var(--t3);margin-bottom:14px;line-height:1.5">你可以親口告訴阿錢你們的財務目標和重要的事，他會記住、並在每天的建議和對話裡用上。這些是<b>兩人共用</b>的記憶。</div>

    <!-- 財務目標 -->
    <div style="font-size:.82rem;font-weight:900;color:var(--t);margin-bottom:8px">🎯 我們的財務目標</div>
    <div id="mem-goals" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px"></div>
    <div style="display:flex;gap:6px;margin-bottom:18px">
      <input id="mem-goal-input" type="text" placeholder="例如：年底還清卡債"
        style="flex:1;padding:9px 12px;border-radius:10px;background:var(--card2);border:1.5px solid var(--border);color:var(--t);font-size:.85rem;font-family:inherit">
      <button onclick="memAddGoal()" class="btn btn-p" style="flex-shrink:0;padding:9px 14px">加入</button>
    </div>

    <!-- 想讓阿錢記得的事 -->

    <div id="mem-facts" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px"></div>
    <div style="display:flex;gap:6px;margin-bottom:18px">
      <input id="mem-fact-input" type="text" placeholder="例如：我們在存日本旅遊基金"

    <!-- 阿錢觀察到的（唯讀）-->
    <div id="mem-observed" style="display:none">
      <div style="font-size:.82rem;font-weight:900;color:var(--t);margin-bottom:8px">👀 阿錢觀察到的</div>

    <button class="btn btn-s" onclick="closeModal('memory-modal')">關閉</button>
  </div>
</div>

<!-- 📜 對話歷史（按日期分組，本機）-->

    <div id="history-body"></div>
    <button class="btn btn-s" style="margin-top:14px" onclick="closeModal('history-modal')">關閉</button>

</div>

<!-- 快速提問 + 輸入列 -->
<div class="adv-input-bar">

</div>

<script>
// 套用使用者偏好（主題/配色/字體大小）— 與其他頁一致，讓設定的字體大小對阿錢頁生效
if (typeof applyTheme === 'function') applyTheme();

// ── 對話狀態 ──────────────────────────────────────────
let _advHistory = [];   // [{role, content}] 本次 session 對話
let _advBusy = false;

// 完整對話歷史（本機、uid 前綴，維持隱私一致；不上雲）
const ADV_HISTORY_KEY = 'advisor_chat_log';
const ADV_LOG_MAX = 800;       // 全部歷史上限（超過修剪最舊）
const ADV_VIEW_TAIL = 30;      // 進頁時畫面只渲染最近幾則

function _advKey() { return (typeof pKey === 'function') ? pKey(ADV_HISTORY_KEY) : ADV_HISTORY_KEY; }

function loadAdvSession() {
  try {
    const raw = localStorage.getItem(_advKey());
    const j = raw ? JSON.parse(raw) : null;
    if (j && Array.isArray(j.turns)) _advHistory = j.turns;
    // 相容舊版 key（advisor_chat_session）：搬過來一次
    if (!_advHistory.length && typeof pKey === 'function') {
      const oldRaw = localStorage.getItem(pKey('advisor_chat_session'));
      if (oldRaw) { const o = JSON.parse(oldRaw); if (o && Array.isArray(o.turns)) _advHistory = o.turns; }
    }
  } catch(e) {}
}
function saveAdvSession() {
  try {
    // 補上時間戳（剛 push 的那筆若沒有 ts 就補 now），並修剪到上限
    const now = Date.now();
    _advHistory.forEach(t => { if (t && !t.ts) t.ts = now; });
    if (_advHistory.length > ADV_LOG_MAX) _advHistory = _advHistory.slice(-ADV_LOG_MAX);
    localStorage.setItem(_advKey(), JSON.stringify({ turns: _advHistory, at: now }));
  } catch(e) {}
}

// ── 渲染對話 ──────────────────────────────────────────
// atts（可選）：[{kind,name,preview}] 用於在使用者泡泡顯示附件
function appendBub(role, text, atts) {
  const msgs = document.getElementById('adv-msgs');
  const row = document.createElement('div');
  row.className = 'bub-row' + (role === 'user' ? ' me' : '');
  const ava = document.createElement('div');
  ava.className = 'bub-ava';
  ava.textContent = role === 'user' ? '🙂' : '💰';
  const bub = document.createElement('div');
  bub.className = 'bub';
  if (text) bub.textContent = text;
  // 附件呈現
  if (Array.isArray(atts) && atts.length) {
    atts.forEach(a => {
      if (a.kind === 'image' && a.preview) {
        const im = document.createElement('img');
        im.src = a.preview;
        bub.appendChild(im);
      } else {
        const d = document.createElement('div');
        d.className = 'bub-att';
        d.textContent = (a.kind === 'pdf' ? '📄 ' : '📑 ') + (a.name || '檔案');
        bub.appendChild(d);
      }
    });
  }
  row.appendChild(ava);
  row.appendChild(bub);
  msgs.appendChild(row);
  scrollBottom();
  return bub;
}

function showTyping() {
  const msgs = document.getElementById('adv-msgs');
  const row = document.createElement('div');
  row.className = 'bub-row';
  row.id = 'adv-typing';
  row.innerHTML = '<div class="bub-ava">💰</div><div class="bub typing"><span class="dots"><span>●</span><span>●</span><span>●</span></span></div>';
  msgs.appendChild(row);
  scrollBottom();
}
function hideTyping() {
  const t = document.getElementById('adv-typing');
  if (t) t.remove();
}
function scrollBottom() {
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 60);
}

// ── 🎤 語音輸入（重用 App 既有模式；填入輸入框，讓使用者檢視後再送）──
let _advVoiceRec = null;
function startAdvVoice(btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    appendBub('assistant', '這個裝置或瀏覽器不支援語音輸入，直接打字也可以喔。iOS 的話建議用 Safari 開啟。');
    document.getElementById('adv-text').focus();
    return;
  }
  // 正在錄音 → 再按一下停止
  if (_advVoiceRec) { try { _advVoiceRec.stop(); } catch(e) {} _advVoiceRec = null; return; }

  const rec = new SR();
  rec.lang = 'zh-TW';
  rec.interimResults = true;   // 即時顯示，講話過程就看得到
  rec.continuous = false;
  const el = document.getElementById('adv-text');
  const baseText = el.value ? el.value + ' ' : '';

  rec.onstart = () => {
    _advVoiceRec = rec;
    btn.textContent = '🔴';
    btn.style.background = 'rgba(244,63,94,.15)';
    btn.style.borderColor = 'var(--danger)';
  };
  rec.onresult = (e) => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    el.value = baseText + txt;
    advAutogrow(el);
  };
  rec.onerror = (e) => {
    _advVoiceRec = null;
    _restoreAdvVoiceBtn(btn);
    if (e.error === 'aborted') return;
    const map = {

// 待送出的附件：[{kind:'image'|'pdf'|'text', name, mediaType, data(base64)|text, preview}]
let _advAttachments = [];
const ADV_MAX_FILE_MB = 12;

function onAdvFilePicked(ev) {
  const files = Array.from(ev.target.files || []);
  ev.target.value = ''; // 允許重選同檔
  files.forEach(readAdvFile);
}

function readAdvFile(file) {
  if (!file) return;
  const sizeMB = file.size / (1024 * 1024);
  if (sizeMB > ADV_MAX_FILE_MB) {
    appendBub('assistant', `「${file.name}」有 ${sizeMB.toFixed(1)}MB，超過 ${ADV_MAX_FILE_MB}MB 上限了。圖片可以先截小一點，或 PDF 拆開再給我。`);
    return;
  }
  const name = file.name || '檔案';
  const type = (file.type || '').toLowerCase();
  const lower = name.toLowerCase();
  const isImage = type.startsWith('image/');
  const isPdf = type === 'application/pdf' || lower.endsWith('.pdf');
  const isText = type.startsWith('text/') || /\.(md|markdown|txt|csv|json)$/.test(lower);

  if (isImage) {
    const r = new FileReader();
    r.onload = () => {
      const dataUrl = r.result;
      const base64 = String(dataUrl).split(',')[1] || '';
      _advAttachments.push({ kind: 'image', name, mediaType: type || 'image/jpeg', data: base64, preview: dataUrl });
      renderAttachPreview();
    };
    r.readAsDataURL(file);
  } else if (isPdf) {
    const r = new FileReader();
    r.onload = () => {
      const base64 = String(r.result).split(',')[1] || '';
      _advAttachments.push({ kind: 'pdf', name, mediaType: 'application/pdf', data: base64 });
      renderAttachPreview();
    };
    r.readAsDataURL(file);
  } else if (isText) {
    const r = new FileReader();
    r.onload = () => {
      let txt = String(r.result || '');
      if (txt.length > 60000) txt = txt.slice(0, 60000) + '\n…(檔案過長，已截斷)';
      _advAttachments.push({ kind: 'text', name, text: txt });
      renderAttachPreview();
    };
    r.readAsText(file);
  } else {
    appendBub('assistant', `「${name}」這個格式我暫時讀不了。我看得懂圖片、PDF，還有文字類的 md／txt／csv／json。`);
  }
}

function renderAttachPreview() {
  const box = document.getElementById('adv-attach-preview');
  if (!box) return;
  if (!_advAttachments.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'flex';
  box.innerHTML = '';
  _advAttachments.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'att-chip';
    const icon = a.kind === 'image' ? '' : (a.kind === 'pdf' ? '📄' : '📑');
    if (a.kind === 'image' && a.preview) {
      const im = document.createElement('img'); im.src = a.preview; chip.appendChild(im);
    } else {
      const sp = document.createElement('span'); sp.textContent = icon; chip.appendChild(sp);
    }
    const nm = document.createElement('span'); nm.className = 'att-name'; nm.textContent = a.name; chip.appendChild(nm);
    const x = document.createElement('span'); x.className = 'att-x'; x.textContent = '✕';
    x.onclick = () => { _advAttachments.splice(i, 1); renderAttachPreview(); };
    chip.appendChild(x);
    box.appendChild(chip);
  });
}

function advSend() {

async function advAsk(text) {
  if (_advBusy) return;

  let r;
  try {
    // 注意：傳給 API 的 history 不含本次附件佔位那筆，附件走 atts 參數帶當前檔案
    r = await askAdvisor(userText, _advHistory.slice(0, -1), atts);
  } catch (e) {
    r = { ok: false, text: '連線出了點問題，等一下再試試。' };
  }
  hideTyping();

  const replyText = (r && r.text) ? r.text : '阿錢一時語塞，再說一次好嗎？';
  appendBub('assistant', replyText);
  if (r && r.ok) {
    _advHistory.push({ role: 'assistant', content: replyText });

    if (_advHistory.filter(m => m.role === 'user').length % 3 === 0) {
      try { if (typeof summarizeAndRemember === 'function') summarizeAndRemember(_advHistory); } catch(e) {}
    }
  }

  _advBusy = false;
  if (sendBtn) sendBtn.disabled = false;
}

// 擷取可比對的設定（預算/卡片上限/通知）— 全部重用 db.js getter，不碰 settings.html
function _captureSettings() {
  const bcfg = (typeof getBudgetConfig === 'function') ? getBudgetConfig() : { items:{}, startDay:1 };
  const disc = (typeof getDiscord === 'function') ? getDiscord() : {};
  const budgets = {};
  const items = bcfg.items || {};
  Object.keys(items).forEach(k => { budgets[k] = (items[k] && items[k].limit) || 0; });
  return {
    budgets,
    startDay: bcfg.startDay || 1,
    notify: {
      onAdd: disc.onAdd, onDaily: disc.onDaily, dailyHour: disc.dailyHour,
      onBudget: disc.onBudget, budgetPct: disc.budgetPct,
      onWeekly: disc.onWeekly, onMonthly: disc.onMonthly, monthlyDay: disc.monthlyDay,
    },
  };
}

// 回到阿錢時：比對前後差異，整理成人類看得懂的變更清單
function _diffSettings(before, after) {
  const changes = [];
  const bKeys = new Set([...Object.keys(before.budgets || {}), ...Object.keys(after.budgets || {})]);
  bKeys.forEach(k => {
    const ov = (before.budgets || {})[k] || 0;
    const nv = (after.budgets || {})[k] || 0;
    if (ov === nv) return;
    const label = (typeof catName === 'function') ? catName(k) : k;
    if (ov === 0 && nv > 0) changes.push(`新增了「${label}」預算上限 $${nv.toLocaleString()}`);
    else if (nv === 0 && ov > 0) changes.push(`取消了「${label}」的預算上限`);
    else changes.push(`把「${label}」預算從 $${ov.toLocaleString()} 調整為 $${nv.toLocaleString()}`);
  });
  if ((before.startDay||1) !== (after.startDay||1)) changes.push(`把預算週期起算日改為每月 ${after.startDay} 號`);
  const nb = before.notify || {}, na = after.notify || {};
  if (nb.onDaily !== na.onDaily) changes.push(na.onDaily ? '開啟了每日結算通知' : '關閉了每日結算通知');
  if (nb.dailyHour !== na.dailyHour && na.dailyHour != null) changes.push(`把每日結算時間改為 ${na.dailyHour} 點`);
  if (nb.onBudget !== na.onBudget) changes.push(na.onBudget ? '開啟了預算超支警示' : '關閉了預算超支警示');
  if (nb.budgetPct !== na.budgetPct && na.budgetPct != null) changes.push(`把預算警示門檻改為 ${na.budgetPct}%`);
  if (nb.onWeekly !== na.onWeekly) changes.push(na.onWeekly ? '開啟了每週報表' : '關閉了每週報表');
  if (nb.onMonthly !== na.onMonthly) changes.push(na.onMonthly ? '開啟了每月報表' : '關閉了每月報表');
  return changes;
}

// 阿錢針對這次設定變更給回應（有 API key 用 AI，沒有則靜態鼓勵）
async function advisorRespondToSettings(changes) {

// 載入時檢查：剛從設定回來且有變更 → 阿錢開口
async function checkSettingsChange() {
  let snapRaw;
  try { snapRaw = sessionStorage.getItem(ADV_SETTINGS_SNAP); } catch(e) { return; }
  if (!snapRaw) return;
  sessionStorage.removeItem(ADV_SETTINGS_SNAP);
  try {
    const before = JSON.parse(snapRaw).data;

      const q = document.getElementById('adv-quick');
      if (q) q.style.display = 'none';
      await advisorRespondToSettings(changes);
    }
  } catch(e) {}
}

// ── 🏅 徽章達標：阿錢的恭喜（與設定回拋同philosophy，不碰 add.html）──
// 比對「目前已解鎖徽章」vs「阿錢已恭喜過的」，新達成的就由阿錢開口恭喜。
const ADV_ACKED_BADGES = 'advisor_acked_badges';
function _advAckedKey() { return (typeof pKey === 'function') ? pKey(ADV_ACKED_BADGES) : ADV_ACKED_BADGES; }

async function checkBadgeUnlocks(opts) {
  if (typeof getUnlockedBadges !== 'function' || typeof BADGES === 'undefined') return;
  let unlocked = {};
  try { unlocked = getUnlockedBadges() || {}; } catch(e) { return; }
  const unlockedIds = Object.keys(unlocked);

  let acked = {};
  try { acked = JSON.parse(localStorage.getItem(_advAckedKey()) || '{}'); } catch(e) {}

  // 第一次使用（從沒記錄過 acked）→ 把現有全部標記為已知，不補恭喜舊徽章
  const firstRun = Object.keys(acked).length === 0 && !localStorage.getItem(_advAckedKey());
  if (firstRun) {
    const seed = {}; unlockedIds.forEach(id => seed[id] = 1);
    try { localStorage.setItem(_advAckedKey(), JSON.stringify(seed)); } catch(e) {}
    return;
  }

  const newIds = unlockedIds.filter(id => !acked[id]);
  if (!newIds.length) return;

  // 找出徽章物件（取 icon/name/desc/rarity）
  const newBadges = newIds.map(id => BADGES.find(b => b.id === id)).filter(Boolean);
  if (!newBadges.length) {
    // 仍標記已知，避免卡住
    newIds.forEach(id => acked[id] = 1);
    try { localStorage.setItem(_advAckedKey(), JSON.stringify(acked)); } catch(e) {}
    return;
  }

  const q = document.getElementById('adv-quick');
  if (q) q.style.display = 'none';

  // 即時恭喜泡泡
  const listText = newBadges.map(b => `${b.icon} ${b.name}`).join('、');
  const rarityName = (id) => { const b = BADGES.find(x=>x.id===id); const r = b && (typeof BADGE_RARITY!=='undefined') && BADGE_RARITY[b.rarity]; return r ? r.name : ''; };
  appendBub('assistant', `🎉 恭喜！你們解鎖了新徽章：${listText}`);
  _advHistory.push({ role:'assistant', content:`🎉 恭喜！你們解鎖了新徽章：${listText}` });

  // 有 API key → 阿錢針對徽章意義說一句鼓勵
  if (typeof getKey === 'function' && getKey() && typeof askAdvisor === 'function') {
    showTyping();
    try {
      const detail = newBadges.map(b => `${b.name}（${b.desc}）`).join('、');
      const ask = `使用者剛剛達成了這些記帳成就徽章：${detail}。請你以阿錢的身份，針對這個成就給一句簡短、真誠、有溫度的恭喜與肯定，連結到這代表他們在財務習慣上的進步。不要條列、不要說教，50～90 字。`;
      const r = await askAdvisor(ask, _advHistory.slice(0, -1));
      hideTyping();
      if (r && r.ok && r.text) {
        appendBub('assistant', r.text);
        _advHistory.push({ role:'assistant', content: r.text });
      }
    } catch(e) { hideTyping(); }
  } else {
    appendBub('assistant', '這些成就不是運氣，是你們一筆一筆記出來的。為你們高興，繼續保持 💪');
  }
  saveAdvSession();

  // 標記為已恭喜
  newIds.forEach(id => acked[id] = 1);
  try { localStorage.setItem(_advAckedKey(), JSON.stringify(acked)); } catch(e) {}
}

function _histDateLabel(ts) {
  const d = new Date(ts || Date.now());
  const today = new Date();
  const y = new Date(today.getTime() - 864e5);
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(d, today)) return '今天';
  if (sameDay(d, y)) return '昨天';
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}（${w}）`;
}
function _histDateKey(ts) {
  const d = new Date(ts || Date.now());
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();

      const txt = _memEsc(typeof t.content === 'string' ? t.content : '');
      return `<div style="margin-bottom:8px;text-align:${align}">
        <div style="font-size:.6rem;color:var(--t3);margin-bottom:2px">${who}</div>
        <div style="display:inline-block;max-width:88%;text-align:left;background:${bg};border:1px solid var(--border);border-radius:12px;padding:8px 11px;font-size:.82rem;line-height:1.55;color:var(--t);white-space:pre-wrap;word-break:break-word">${txt}</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:10px">
      <div onclick="toggleHistDay(${gi})" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px">
        <span style="font-size:.8rem;font-weight:800;color:var(--t)">${_histDateLabel(g.ts)}</span>
        <span style="font-size:.7rem;color:var(--t3)"><span id="hist-caret-${gi}">${open?'▴':'▾'}</span> ${g.turns.length} 則</span>
      </div>
      <div id="hist-day-${gi}" style="display:${open?'block':'none'};padding:12px 4px 4px">${msgs}</div>
    </div>`;
  }).join('');
}
function toggleHistDay(gi) {
  const el = document.getElementById('hist-day-' + gi);
  const caret = document.getElementById('hist-caret-' + gi);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (caret) caret.textContent = open ? '▾' : '▴';
}
function confirmClearHistory() {
  if (!confirm('確定要清空全部對話歷史嗎？此動作無法復原（阿錢對你們的長期記憶——目標、里程碑——會保留）。')) return;
  _advHistory = [];
  saveAdvSession();
  renderHistory();
  document.getElementById('adv-msgs').innerHTML = '';
  const q = document.getElementById('adv-quick');
  if (q) q.style.display = 'flex';
  greet();
  if (typeof closeModal === 'function') closeModal('history-modal');
}

function gotoDailyDetail() {
  const txt = document.getElementById('adv-daily-text').textContent;
  if (txt && !document.getElementById('adv-daily').classList.contains('loading')) {
    advAsk('關於你今天說的「' + txt.slice(0, 30) + '…」，可以多講一點嗎？');
  }
}

// ── 開場白 + 階段 + 今日一句話 ─────────────────────────
function greet() {
  // 沒有 API Key 的提醒
  if (typeof getKey === 'function' && !getKey()) {
    const msgs = document.getElementById('adv-msgs');
    const tip = document.createElement('div');
    tip.className = 'no-key-tip';
    tip.innerHTML = '⚠️ 還沒設定 Claude API Key，阿錢沒辦法開口。請到「設定 → API 設定」填入後，回來找他聊聊。';
    msgs.appendChild(tip);
  }
  const me = (typeof currentUser === 'function') ? currentUser() : '';
  appendBub('assistant', `嗨${me ? '，' + me : ''}，我是阿錢 💰\n你的家庭財務全局我都看著——收支、存錢、目標，甚至你今天累不累。有什麼想聊的，數字的、心情的，都可以跟我說。\n錢的事，慢慢來，但要一直走。`);
}

function renderStage() {
  try {
    const stage = getAdvisorStage();
    document.getElementById('adv-stage').textContent = '📍 目前：' + stage.name;
  } catch(e) {
    document.getElementById('adv-stage').textContent = '📍 財務階段';
  }
}

// 成長軌跡（里程碑時間軸）
function renderJourney() {
  try {
    const mem = (typeof getAdvisorMemory === 'function') ? getAdvisorMemory() : null;
    const ms = (mem && Array.isArray(mem.milestones)) ? mem.milestones : [];
    const wrap = document.getElementById('adv-journey');
    const body = document.getElementById('journey-body');
    if (!wrap || !body) return;
    // 至少有 2 個里程碑（起點 + 一次前進）才顯示，否則沒有「路」可看
    if (ms.length < 2) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    const curOrder = (() => { try { return getAdvisorStage().order; } catch(e){ return 0; } })();
    // 依日期排序
    const sorted = ms.slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
    body.innerHTML = sorted.map((m, i) => {
      const isLast = i === sorted.length - 1;
      const dot = isLast ? '#00e5b4' : 'var(--t3)';
      const line = i < sorted.length - 1
        ? '<div style="position:absolute;left:6px;top:16px;bottom:-10px;width:2px;background:var(--border)"></div>' : '';
      return `<div style="position:relative;padding-left:24px;padding-bottom:${isLast?'2':'14'}px">
        ${line}
        <div style="position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:${dot};border:2px solid var(--bg)"></div>
        <div style="font-size:.7rem;color:var(--t3)">${m.date||''}</div>
        <div style="font-size:.86rem;font-weight:800;color:var(--t);margin-top:1px">${m.title||''}</div>
        ${m.context?`<div style="font-size:.72rem;color:var(--t2);margin-top:2px;line-height:1.5">${m.context}</div>`:''}
      </div>`;
    }).join('');
  } catch(e) {}
}

function toggleJourney() {
  const body = document.getElementById('journey-body');
  const caret = document.getElementById('journey-caret');
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (caret) caret.textContent = open ? '展開 ▾' : '收起 ▴';
}

// 今日一句話：讀共用快取，沒有今天的就（有 key 時）生成並存，與 Discord 推送共用同一份
async function renderDaily() {
  const el = document.getElementById('adv-daily');
  const txt = document.getElementById('adv-daily-text');
  try {
    let daily = null;
    if (typeof fbPullDailyAdvice === 'function') {
      daily = await fbPullDailyAdvice();
    }
    const today = (typeof toLocalISO === 'function') ? toLocalISO() : new Date().toISOString().slice(0,10);
    if (daily && daily.date === today && daily.text) {
      el.classList.remove('loading');
      txt.textContent = daily.text;
      return;
    }
    // 今天還沒有 → 有 API key 才生成（省 token：一天只生成一次，存雲端兩人共用）
    if (typeof getKey === 'function' && getKey() && typeof generateDailyAdvice === 'function') {
      const r = await generateDailyAdvice();
      if (r && r.ok && r.text) {
        el.classList.remove('loading');
        txt.textContent = r.text;
        if (typeof fbSaveDailyAdvice === 'function') fbSaveDailyAdvice(today, r.text);
        return;
      }
    }
    // 沒 key 或生成失敗 → 給一句靜態問候，不空白
    el.classList.remove('loading');
    txt.textContent = '今天也記得記一筆帳喔，我在這裡看著你們的每一步。';
  } catch(e) {
    el.classList.remove('loading');
    txt.textContent = '今天也一起加油，有事隨時找我。';
  }
}

// ── 初始化 ────────────────────────────────────────────
loadAdvSession();
function bootAdvisor() {
  renderStage();
  renderJourney();
  // 還原對話：畫面只顯示最近 ADV_VIEW_TAIL 則（完整歷史用 📜 翻閱）
  if (_advHistory.length) {
    const q = document.getElementById('adv-quick');
    if (q) q.style.display = 'none';
    const tail = _advHistory.slice(-ADV_VIEW_TAIL);
    if (_advHistory.length > tail.length) {
      const more = document.createElement('div');
      more.style.cssText = 'text-align:center;margin:6px 0 14px';
      more.innerHTML = '<button onclick="openHistoryPanel()" style="background:var(--card);border:1px solid var(--border);color:var(--t2);border-radius:50px;padding:6px 14px;font-size:.74rem;cursor:pointer;font-family:inherit">📜 查看更早的對話（共 ' + _advHistory.length + ' 則）</button>';
      document.getElementById('adv-msgs').appendChild(more);
    }
    tail.forEach(m => appendBub(m.role, typeof m.content === 'string' ? m.content : ''));
  } else {
    greet();
  }
  renderDaily();
  // ⚙️ 剛從設定回來且有變更 → 阿錢開口把關；🏅 有新徽章 → 阿錢恭喜
  (async () => {
    await checkSettingsChange();
    await checkBadgeUnlocks();
  })();
}

if (typeof fbPullAll === 'function') {
  fbPullAll().then(async () => {
    if (typeof fbPullAdvisorMemory === 'function') { try { await fbPullAdvisorMemory(); } catch(e){} }
    renderStage();
    renderJourney();
    renderDaily();
  }).catch(()=>{});
}
bootAdvisor();
</script>
</body>
</html>
