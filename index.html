<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>家庭記帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="hdr">
  <div>
    <h1>🏡 家庭記帳</h1>
    <div class="hdr-sub" id="hdr-date"></div>
  </div>
  <div style="display:flex;gap:8px">
    <a href="./private.html" id="priv-btn" style="display:none" class="hdr-btn" title="私密記帳">🔒</a>
    <a href="./memo.html" id="memo-btn" style="display:none" class="hdr-btn" title="備忘錄">📝</a>
    <a href="./settings.html" class="hdr-btn">⚙️</a>
  </div>
</header>

<div class="w">
  <div class="mrow" id="mrow">
    <button class="mbtn" onclick="prevM()">‹</button>
    <div class="mlbl" id="mlbl"></div>
    <button class="mbtn" onclick="nextM()">›</button>
  </div>
  <div class="hero">
    <div class="hero-lbl" id="hero-lbl">📅 本月總支出</div>
    <div class="hero-amt"><span class="cur">$</span><span id="h-t">0</span></div>
    <div class="hero-sub">
      <span>💳 信用卡 <b id="h-cc">0</b></span>
      <span>💵 現金 <b id="h-cs">0</b></span>
    </div>
  </div>
  <div class="sg">
    <div class="sc g"><div class="sc-lbl">👛 錢包</div><div class="sc-val"><span class="u">$</span><span id="s-w">0</span></div></div>
    <div class="sc b"><div class="sc-lbl">🙋 宏龍</div><div class="sc-val"><span class="u">$</span><span id="s-1">0</span></div></div>
    <div class="sc w"><div class="sc-lbl">🙋‍♀️ 盈慧</div><div class="sc-val"><span class="u">$</span><span id="s-2">0</span></div></div>
  </div>
  <!-- 週期切換 -->
  <div id="cycle-toggle-bar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;background:var(--card);border-radius:var(--rs);padding:8px 12px;border:1.5px solid var(--border)">
    <span id="cycle-range-lbl" style="font-size:.8rem;color:var(--t2)"></span>
    <button onclick="toggleCycleMode()" id="cycle-toggle-btn" style="padding:5px 14px;border-radius:50px;border:1.5px solid var(--p);background:var(--pdim);color:var(--p);font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap"></button>
  </div>
  <!-- 搜尋框 -->
  <div style="position:relative;margin-bottom:8px">
    <input type="text" id="search-input" placeholder="🔍 搜尋明細、分類、金額..."
      oninput="onSearch()"
      style="width:100%;box-sizing:border-box;background:var(--card);border:1.5px solid var(--border);border-radius:var(--rs);padding:11px 36px 11px 14px;color:var(--t);font-size:.88rem;font-family:inherit;outline:none;transition:border-color .2s"
      onfocus="this.style.borderColor='var(--p)'" onblur="this.style.borderColor='var(--border)'">
    <button id="search-clear" onclick="clearSearch()" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);font-size:1.1rem;cursor:pointer;padding:4px">✕</button>
  </div>
  <div class="pills" id="filter-pills">
    <button class="pill on" onclick="setF('all',this)">全部</button>
    <button class="pill" onclick="setF('宏龍',this)">宏龍</button>
    <button class="pill" onclick="setF('盈慧',this)">盈慧</button>
    <button class="pill" onclick="setF('cash',this)">💵 現金</button>
    <button class="pill" onclick="setF('card',this)">💳 信用卡</button>
    <button class="pill" onclick="setF('icard',this)">🎫 悠遊卡</button>
    <button class="pill" onclick="setF('acct',this)">🏦 帳戶</button>
  </div>
  <div id="list"></div>
  <div style="height:24px"></div>
</div>

<nav class="nav">
  <a class="ni on" href="./index.html"><span class="ic">📋</span><span>列表</span></a>
  <a class="ni" href="./report.html"><span class="ic">📊</span><span>報表</span></a>
  <a class="ni ni-add" href="./add.html"><div class="fab">➕</div></a>
  <a class="ni" href="./wallet.html"><span class="ic">👛</span><span>錢包</span></a>
  <a class="ni" href="./shopping.html"><span class="ic">🛒</span><span>網購</span></a>
</nav>
<div class="toast" id="toast"></div>
<!-- Undo Toast -->
<div id="undo-toast" style="display:none;position:fixed;bottom:calc(var(--nav) + 16px);left:50%;transform:translateX(-50%);z-index:400;background:var(--card);border:1.5px solid var(--border);border-radius:50px;padding:10px 8px 10px 16px;display:none;align-items:center;gap:10px;font-size:.85rem;color:var(--t);box-shadow:0 4px 20px rgba(0,0,0,.3);white-space:nowrap;max-width:calc(100vw - 32px)">
  <span id="undo-msg">已刪除</span>
  <button onclick="undoDelete()" style="background:var(--p);color:#000;border:none;border-radius:50px;padding:5px 14px;font-weight:900;font-size:.82rem;cursor:pointer;font-family:inherit">↩ 復原</button>
</div>
<!-- 編輯記帳 Modal -->
<div class="ov" id="edit-modal">
  <div class="sheet">
    <div class="sh"></div>
    <div class="st">✏️ 編輯記帳</div>
    <div class="fg">
      <span class="flbl">💰 金額</span>
      <input type="number" class="fc" id="e-amt" inputmode="numeric">
    </div>
    <div class="fg">
      <span class="flbl">📅 日期時間</span>
      <input type="datetime-local" class="fc" id="e-dt">
    </div>
    <div class="fg">
      <span class="flbl">🏷️ 分類</span>
      <select class="fc" id="e-cat"></select>
    </div>
    <div class="fg" id="e-subcat-fg">
      <span class="flbl">📂 子分類（可略）</span>
      <select class="fc" id="e-subcat"></select>
    </div>
    <div class="fg">
      <span class="flbl">📝 明細（可略）</span>
      <input type="text" class="fc" id="e-detail" placeholder="例：家樂福採購" maxlength="30">
    </div>
    <div class="fg">
      <span class="flbl">🏷️ 消費標籤（可略）</span>
      <div id="e-tag-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px"></div>
    </div>
    <div class="fg">
      <span class="flbl">👤 記帳人</span>
      <div class="tg">
        <button class="tb" id="e-p-hl" onclick="setEP('宏龍',this)">🙋 宏龍</button>
        <button class="tb" id="e-p-yh" onclick="setEP('盈慧',this)">🙋‍♀️ 盈慧</button>
      </div>
    </div>
    <div class="fg">
      <span class="flbl">💳 付款方式</span>
      <div class="tg" style="flex-wrap:wrap;gap:8px">
        <button class="tb" id="e-pay-cash"  onclick="setEPay('cash',this)"  style="flex:none;padding:10px 14px">💵 現金</button>
        <button class="tb" id="e-pay-card"  onclick="setEPay('card',this)"  style="flex:none;padding:10px 14px">💳 信用卡</button>
        <button class="tb" id="e-pay-icard" onclick="setEPay('icard',this)" style="flex:none;padding:10px 14px">🎫 悠遊卡</button>
        <button class="tb" id="e-pay-acct"  onclick="setEPay('acct',this)"  style="flex:none;padding:10px 14px">🏦 帳戶</button>
      </div>
    </div>
    <div class="fg" id="e-card-fg" style="display:none">
      <span class="flbl">🃏 選擇信用卡</span>
      <select class="fc" id="e-card-sel"></select>
    </div>
    <div class="fg" id="e-icard-fg" style="display:none">
      <span class="flbl">🎫 選擇悠遊卡</span>
      <select class="fc" id="e-icard-sel"></select>
    </div>
    <div class="fg" id="e-acct-fg" style="display:none">
      <span class="flbl">🏦 選擇帳戶</span>
      <select class="fc" id="e-acct-sel"></select>
    </div>
    <div class="btn-row">
      <button class="btn btn-s" onclick="closeEdit()">取消</button>
      <button class="btn btn-p" onclick="submitEdit()">💾 儲存</button>
    </div>
  </div>
</div>

<div class="ov" id="modal">
  <div class="sheet">
    <div class="sh"></div>
    <div class="st" id="m-title"></div>
    <p id="m-msg" style="color:var(--t2);font-size:.9rem;margin-bottom:18px;line-height:1.6"></p>
    <div class="btn-row">
      <button class="btn btn-s" onclick="closeM()">取消</button>
      <button class="btn btn-d" id="m-ok">確認刪除</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="./js/auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./js/db.js"></script>
<script src="./js/firebase.js"></script>
<script src="./js/assistant.js"></script>
<script>
const CAT_IC={food:'🍜',transport:'🚌',shopping:'🛍️',home:'🏠',medical:'💊',entertain:'🎬',education:'📚',child:'👶',other:'📦'};
const CAT_CL={food:'',transport:'b',shopping:'w',home:'pk',medical:'pu',entertain:'b',education:'',child:'w',other:''};
const MN=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
let cy=new Date().getFullYear(), cm=new Date().getMonth()+1, filt='all';
let cycleMode=false; // false=標準月, true=週期月

function toggleCycleMode(){
  cycleMode=!cycleMode;
  render();
}

function updateCycleBar(){
  const btn=document.getElementById('cycle-toggle-btn');
  const lbl=document.getElementById('cycle-range-lbl');
  const mrow=document.getElementById('mrow');
  if(cycleMode){
    const {start:s,end:e}=getBudgetPeriod();
    const fmt2=d=>`${d.getMonth()+1}/${d.getDate()}`;
    lbl.textContent=`📅 週期：${fmt2(s)} ～ ${fmt2(e)}`;
    btn.textContent='切換標準月';
    if(mrow) mrow.style.display='none';
  } else {
    lbl.textContent=`📅 標準月：${cy} 年 ${MN[cm-1]} 月`;
    btn.textContent='切換週期月';
    if(mrow) mrow.style.display='';
  }
}

function render() {
  document.getElementById('mlbl').textContent=`${cy} 年 ${MN[cm-1]} 月`;
  updateCycleBar();
  let list = cycleMode ? txByPeriod() : txByMonth(cy,cm);
  const s=calcStats(list);
  document.getElementById('hero-lbl').textContent = cycleMode ? '📅 本期總支出' : '📅 本月總支出';
  document.getElementById('h-t').textContent=fmt(s.total);
  document.getElementById('h-cc').textContent=fmt(s.card);
  document.getElementById('h-cs').textContent=fmt(s.cash);
  document.getElementById('s-w').textContent=fmt(getWal().balance);
  document.getElementById('s-1').textContent=fmt(s.byPerson['宏龍']||0);
  document.getElementById('s-2').textContent=fmt(s.byPerson['盈慧']||0);

  // 付款方式篩選
  if(filt==='宏龍'||filt==='盈慧') list=list.filter(t=>t.person===filt);
  else if(filt==='cash')  list=list.filter(t=>t.pay==='cash');
  else if(filt==='card')  list=list.filter(t=>t.pay==='card');
  else if(filt==='icard') list=list.filter(t=>t.pay==='icard');
  else if(filt==='acct')  list=list.filter(t=>t.pay==='acct');

  // 搜尋篩選
  if(searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(t =>
      (t.detail||'').toLowerCase().includes(q) ||
      catName(t.cat).toLowerCase().includes(q) ||
      (t.subCat||'').toLowerCase().includes(q) ||
      (t.person||'').includes(q) ||
      String(t.amount).includes(q)
    );
  }

  const el=document.getElementById('list');
  if(!list.length){
    const emptyMsg = searchQ
      ? `<div class="empty"><div class="ei">🔍</div><p>找不到「${searchQ}」<br>試試其他關鍵字</p></div>`
      : `<div class="empty"><div class="ei">📭</div><p>還沒有記帳<br>點 ➕ 開始記帳</p></div>`;
    el.innerHTML=emptyMsg; return;
  }
  const g=groupDay(list);
  el.innerHTML=Object.entries(g).map(([d,ts])=>{
    const dt=ts.reduce((s,t)=>s+t.amount,0);
    return `<div class="day-h"><span class="day-d">📅 ${d}</span><span class="day-t">-$${fmt(dt)}</span></div>`+ts.map(txHTML).join('');
  }).join('');
}

// 搜尋相關函數
function onSearch() {
  searchQ = document.getElementById('search-input').value.trim();
  document.getElementById('search-clear').style.display = searchQ ? 'block' : 'none';
  // 搜尋時隱藏篩選 pills（避免干擾）
  document.getElementById('filter-pills').style.display = searchQ ? 'none' : 'flex';
  render();
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQ = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('filter-pills').style.display = 'flex';
  render();
}

function txHTML(t) {
  const ic=CAT_IC[t.cat]||'📦', cl=CAT_CL[t.cat]||'';
  let _acctName = '帳戶';
  if (t.pay==='acct' && t.acctId) {
    const _aid = t.acctId.startsWith('shared_') ? t.acctId.replace('shared_','') : t.acctId;
    const _isSh = t.acctId.startsWith('shared_');
    const _ac = acctFind(_aid, _isSh);
    if (_ac) _acctName = _ac.name;
  }
  const pay = t.pay==='cash'  ? '💵 現金'
           : t.pay==='icard' ? `🎫 ${typeof icardFind==='function'&&icardFind(t.icardId)?icardFind(t.icardId).name:'悠遊卡'}`
           : t.pay==='acct'  ? `🏦 ${_acctName}`
           : `💳 ${typeof getCardName==='function'?getCardName(t.cardId):(cardFind(t.cardId)?.name||'信用卡')}`;
  const tagBadges = (t.tags&&t.tags.length)
    ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px">${
        t.tags.map(tid=>{
          const tg=getTxTagById(tid);
          return tg ? `<span style="font-size:.65rem;padding:2px 8px;border-radius:50px;background:${tg.color}22;color:${tg.color};border:1px solid ${tg.color}44;font-weight:700">${tg.label}</span>` : '';
        }).join('')
      }</div>` : '';
  return `<div class="tx"><div class="tx-ic ${cl}">${ic}</div>
    <div class="tx-body">
      <div class="tx-name">${t.detail||catName(t.cat)}</div>
      <div class="tx-meta"><span class="tag">${catName(t.cat)}</span><span class="tag">${t.person}</span><span class="tag">${pay}</span></div>
      ${tagBadges}
      <div style="display:flex;gap:6px;margin-top:5px">
        <button class="tx-del" style="background:var(--pdim);color:var(--p)" onclick="askEdit('${t.id}',event)">編輯</button>
        <button class="tx-del" onclick="askDel('${t.id}',event)">刪除</button>
      </div>
    </div>
    <div class="tx-r"><div class="tx-amt">-$${fmt(t.amount)}</div><div class="tx-time">${fmtT(t.at)}</div></div>
  </div>`;
}

function setF(f,el){filt=f;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');render();}
function prevM(){cm--;if(cm<1){cm=12;cy--}render();}
function nextM(){cm++;if(cm>12){cm=1;cy++}render();}

let editId = '';
let editPerson = '宏龍';
let editPay = 'cash';
let editTags = [];
let searchQ = '';        // 搜尋關鍵字
let _undoTimer = null;   // undo 計時器
let _undoTx = null;      // 待復原的交易

function askEdit(id, e) {
  e.stopPropagation();
  editId = id;
  const tx = getTx().find(t => t.id === id);
  if (!tx) return;

  // 填入現有資料
  document.getElementById('e-amt').value = tx.amount;
  // 日期
  const d = new Date(tx.at);
  document.getElementById('e-dt').value =
    new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  // 分類
  const catSel = document.getElementById('e-cat');
  catSel.innerHTML = getCats().map(c =>
    `<option value="${c.id}" ${c.id===tx.cat?'selected':''}>${c.name}</option>`
  ).join('');
  catSel.onchange = () => buildEditSubCatSel(catSel.value, '');
  // 子分類、明細
  buildEditSubCatSel(tx.cat, tx.subCat || '');
  document.getElementById('e-detail').value = tx.detail || '';
  // 記帳人
  editPerson = tx.person || '宏龍';
  document.getElementById('e-p-hl').classList.toggle('on', editPerson==='宏龍');
  document.getElementById('e-p-yh').classList.toggle('on', editPerson==='盈慧');

  // 付款方式
  editPay = tx.pay || 'cash';
  ['cash','card','icard','acct'].forEach(p => {
    const btn = document.getElementById('e-pay-'+p);
    if (btn) btn.classList.toggle('on', editPay===p);
  });
  // 信用卡下拉
  const cardSel = document.getElementById('e-card-sel');
  const allCards = typeof getAllAvailableCards==='function' ? getAllAvailableCards() : getCards().map(c=>({...c,_owner:'我的'}));
  cardSel.innerHTML = allCards.map(c =>
    `<option value="${c.id}" ${c.id===tx.cardId?'selected':''}>${c.name} ···${c.last4}${c._owner!=='我的'?' ('+c._owner+')':''}</option>`
  ).join('') || '<option value="">尚無信用卡</option>';
  // 悠遊卡下拉
  const icardSel = document.getElementById('e-icard-sel');
  const allIcards = typeof getAllAvailableIcards==='function' ? getAllAvailableIcards() : getIcards().map(c=>({...c,_owner:'我的'}));
  icardSel.innerHTML = allIcards.map(c =>
    `<option value="${c.id}" ${c.id===tx.icardId?'selected':''}>${c.name}${c._owner!=='我的'?' ('+c._owner+')':''}</option>`
  ).join('') || '<option value="">尚無悠遊卡</option>';
  // 顯示對應卡片選單
  document.getElementById('e-card-fg').style.display  = editPay==='card'  ? 'block' : 'none';
  document.getElementById('e-icard-fg').style.display = editPay==='icard' ? 'block' : 'none';
  document.getElementById('e-acct-fg').style.display  = editPay==='acct'  ? 'block' : 'none';
  // 帳戶選單
  const allAccts = [
    ...getAccts(false).map(a=>({...a, _shared:false})),
    ...getAccts(true).map(a=>({...a, _shared:true, id:'shared_'+a.id}))
  ];
  document.getElementById('e-acct-sel').innerHTML = allAccts.map(a =>
    `<option value="${a.id}" ${a.id===(tx.acctId||'')?'selected':''}>${a.name} $${fmt(a.balance||0)}${a._shared?' (家用)':''}</option>`
  ).join('') || '<option value="">尚無帳戶</option>';

  // 標籤
  editTags = [...(tx.tags||[])];
  renderEditTagChips();
  document.getElementById('edit-modal').classList.add('show');
}

function setEP(p, el) {
  editPerson = p;
  document.querySelectorAll('#e-p-hl,#e-p-yh').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}

function setEPay(p, el) {
  editPay = p;
  document.querySelectorAll('#e-pay-cash,#e-pay-card,#e-pay-icard,#e-pay-acct').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('e-card-fg').style.display  = p==='card'  ? 'block' : 'none';
  document.getElementById('e-icard-fg').style.display = p==='icard' ? 'block' : 'none';
  document.getElementById('e-acct-fg').style.display  = p==='acct'  ? 'block' : 'none';
}

function closeEdit() {
  document.getElementById('edit-modal').classList.remove('show');
}

async function submitEdit() {
  const amt = parseInt(document.getElementById('e-amt').value) || 0;
  if (!amt) { toast('金額不可為 0', 'warn'); return; }

  const list = getTx();
  const idx  = list.findIndex(t => t.id === editId);
  if (idx < 0) return;

  const old = list[idx];
  const dtv = document.getElementById('e-dt').value;

  // 新的付款方式與卡片
  const newPay    = editPay;
  const newCardId  = newPay === 'card'  ? (document.getElementById('e-card-sel').value  || null) : null;
  const newIcardId = newPay === 'icard' ? (document.getElementById('e-icard-sel').value || null) : null;

  // ── 1. 還原舊扣款 ──────────────────────────────────
  if (old.pay === 'cash')                          walIn(old.amount, '編輯還原');
  if (old.pay === 'icard' && old.icardId)          icardIn(old.icardId, old.amount, '編輯還原');
  if (old.pay === 'card'  && old.cardId)           cardVoidBill(old.cardId, old.amount, old.id);

  // ── 2. 更新記帳資料 ────────────────────────────────
  list[idx] = {
    ...old,
    amount:  amt,
    cat:     document.getElementById('e-cat').value,
    subCat:  document.getElementById('e-subcat').value,
    detail:  document.getElementById('e-detail').value.trim(),
    person:  editPerson,
    pay:     newPay,
    cardId:  newCardId,
    icardId: newIcardId,
    acctId:  editPay==='acct' ? document.getElementById('e-acct-sel').value : null,
    at:      dtv ? new Date(dtv).toISOString() : old.at,
    editedAt: new Date().toISOString(),
    tags:    [...editTags],
  };
  DB.set('tx', list);

  // ── 3. 重新依新付款方式扣款 ────────────────────────
  const updated = list[idx];
  const label   = updated.detail || catName(updated.cat);
  if (updated.pay === 'cash')                          walOut(updated.amount, label);
  if (updated.pay === 'icard' && updated.icardId)      icardOut(updated.icardId, updated.amount, label);
  if (updated.pay === 'card'  && updated.cardId)       cardAddBill(updated.cardId, updated.amount, label, updated.at);

  // ── 4. 同步 Firebase ───────────────────────────────
  await fbAddTx(updated);
  fbSyncPersonal();

  closeEdit();
  render();
  toast('已儲存修改 ✅');
}

function askDel(id, e) {
  e.stopPropagation();
  const tx = getTx().find(t=>t.id===id);
  if (!tx) return;

  // 先暫存，5 秒內可復原
  _undoTx = tx;

  // 立即從 UI 移除（樂觀更新）
  delTx(id);
  fbDelTx(id);
  render();

  // 顯示 undo toast
  const ut = document.getElementById('undo-toast');
  const label = tx.detail || catName(tx.cat);
  document.getElementById('undo-msg').textContent = `已刪除「${label} $${fmt(tx.amount)}」`;
  ut.style.display = 'flex';
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => {
    ut.style.display = 'none';
    _undoTx = null;
  }, 5000);
}

function undoDelete() {
  if (!_undoTx) return;
  clearTimeout(_undoTimer);
  // 復原：重新加回（不重新扣款，因為 delTx 已還原）
  const tx = _undoTx;
  _undoTx = null;
  const list = getTx();
  list.unshift(tx);
  DB.set('tx', list);
  fbAddTx(tx);
  document.getElementById('undo-toast').style.display = 'none';
  render();
  toast(`已復原「${tx.detail||catName(tx.cat)}」✅`);
}

// ── 編輯子分類下拉 ────────────────────────────────────
function buildEditSubCatSel(catId, currentVal) {
  const cat = catFind(catId);
  const fg  = document.getElementById('e-subcat-fg');
  const sel = document.getElementById('e-subcat');
  if (!cat.sub || !cat.sub.length) {
    sel.innerHTML = '<option value="">（無子分類）</option>';
    return;
  }
  sel.innerHTML = '<option value="">（可略）</option>' +
    cat.sub.map(s => `<option value="${s}" ${s===currentVal?'selected':''}>${s}</option>`).join('');
}

// ── 編輯標籤 ─────────────────────────────────────────
function renderEditTagChips() {
  const tags = getTxTags();
  const el = document.getElementById('e-tag-chips');
  if (!el) return;
  el.innerHTML = tags.map(tag => {
    const on = editTags.includes(tag.id);
    return `<button onclick="toggleEditTag('${tag.id}')"
      style="padding:6px 11px;border-radius:50px;font-size:.75rem;font-weight:700;cursor:pointer;
             font-family:inherit;transition:.15s;border:1.5px solid ${on ? tag.color : 'var(--border)'};
             background:${on ? tag.color+'26' : 'var(--card)'};color:${on ? tag.color : 'var(--t3)'}"
      >${tag.label}</button>`;
  }).join('');
}
function toggleEditTag(id) {
  const idx = editTags.indexOf(id);
  if (idx >= 0) editTags.splice(idx, 1);
  else editTags.push(id);
  renderEditTagChips();
}
