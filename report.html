@keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.sub-detail-wrap{margin-top:8px;padding:10px 12px;background:var(--card2);border-left:3px solid var(--p);border-radius:6px}
.sub-detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.72rem;color:var(--t2)}
.tx-edit-card{display:flex;align-items:center;justify-content:space-between;padding:7px 6px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;border-radius:6px;margin:0 -6px;gap:8px}
.tx-edit-meta{font-size:.7rem;color:var(--t3);margin-top:2px}

<body>
<header class="hdr">
  <div><h1>📊 報表分析</h1><div class="hdr-sub" id="range-lbl">本月</div></div>
</header>

<div class="w">
  <div class="range-card">
    <div class="range-t">📅 日期區間</div>
    <div class="date-row">
      <input type="date" class="fc" id="df">
      <span style="color:var(--t3);flex-shrink:0">→</span>
      <input type="date" class="fc" id="dt">
    </div>
    <div class="preset-row">
      <button class="pb" data-preset="week"  onclick="preset('week',this)">本週</button>
      <button class="pb" data-preset="month" onclick="preset('month',this)">本月</button>
      <button class="pb" data-preset="7"     onclick="preset('7',this)">近7天</button>
      <button class="pb" data-preset="period" onclick="preset('period',this)">週期月</button>
      <button class="btn-q" onclick="load()">查詢</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="sw('ov',this)">📈 總覽</button>
    <button class="tab" onclick="sw('cat',this)">🏷️ 分類</button>
    <button class="tab" onclick="sw('mon',this)">📅 月份</button>
    <button class="tab" onclick="sw('bud',this)">🎯 預算</button>
    <button class="tab" onclick="sw('tag',this)">🔖 標籤</button>
  </div>


  <!-- 本週支出預測 -->
  <div id="week-pred-card" style="background:var(--card);border:1.5px solid var(--border);border-radius:var(--rs);padding:14px 16px;margin-bottom:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
        <div id="pred-title" style="font-size:.88rem;font-weight:900;color:var(--t)">📅 本週支出預測</div>
        <div style="display:flex;background:var(--card2);border-radius:20px;padding:2px;gap:2px">
          <button id="pred-week-btn" onclick="switchPredMode('week')"
            style="font-size:.72rem;padding:4px 14px;border:none;border-radius:18px;cursor:pointer;font-family:inherit;background:var(--p);color:#000;font-weight:700;white-space:nowrap">本週</button>
          <button id="pred-mon-btn" onclick="switchPredMode('month')"
            style="font-size:.72rem;padding:4px 14px;border:none;border-radius:18px;cursor:pointer;font-family:inherit;background:transparent;color:var(--t3);white-space:nowrap">本月</button>
        </div>
      </div>
      <div id="week-pred-range" style="font-size:.72rem;color:var(--t3);margin-top:2px"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div style="background:var(--card2);border-radius:10px;padding:10px 12px">
        <div style="font-size:.7rem;color:var(--t3);margin-bottom:3px" id="pred-spent-label">本週已花</div>
        <div id="week-spent" style="font-size:1.15rem;font-weight:900;color:var(--danger)">$0</div>
      </div>
      <div style="background:var(--card2);border-radius:10px;padding:10px 12px">
        <div style="font-size:.7rem;color:var(--t3);margin-bottom:3px" id="pred-right-label">預估還會花（<span id="week-days-left">0</span>天）</div>
        <div id="week-predicted" style="font-size:1.15rem;font-weight:900;color:#f59e0b">$0</div>
      </div>
    </div>
    <div id="week-pred-cats" style="font-size:.8rem;color:var(--t2)"></div>
    <!-- 每週預算把關（只在本週模式顯示）-->
    <div id="week-budget-section" style="margin-top:12px"></div>
    <button id="week-detail-toggle" type="button" onclick="toggleWeekDetail()"
      style="width:100%;margin-top:10px;padding:7px;background:none;border:1px solid var(--border);
             border-radius:8px;color:var(--t3);font-size:.75rem;cursor:pointer;font-family:inherit">
      <span style="pointer-events:none">▸ 分類明細</span>
    </button>
    <div id="week-detail-panel" style="display:none;margin-top:8px"></div>
  </div>
  <div style="height:8px"></div>

  <div class="panel on" id="p-ov">
    <div class="sg4">
      <div class="sc4"><div class="v" id="ov-t">$0</div><div class="l">💰 總支出</div></div>
      <div class="sc4"><div class="v" id="ov-n">0</div><div class="l">📋 筆數</div></div>
      <div class="sc4"><div class="v" id="ov-cd">$0</div><div class="l">💳 信用卡</div></div>
      <div class="sc4"><div class="v" id="ov-cs">$0</div><div class="l">💵 現金</div></div>
      <div class="sc4" id="ov-acct-wrap" style="display:none"><div class="v" id="ov-acct">$0</div><div class="l">🏦 帳戶</div></div>
    </div>
    <div class="chart-card">
      <div class="ct">付款方式比例</div>
      <div class="rbar"><div class="rf-c" id="rbar-c" style="width:50%"></div><div class="rf-cc"></div></div>
      <div class="rlbls"><span>💵 現金 <strong id="rp-c">0%</strong></span><span>💳 信用卡 <strong id="rp-cc">0%</strong></span></div>
    </div>
    <div class="chart-card">
      <div class="ct">信用卡各卡消費</div>
      <div id="cb-list"></div>
    </div>
    <div class="chart-card">
      <div class="ct">👥 雙人消費</div>
      <div class="chart-wrap" style="height:200px"><canvas id="person-c"></canvas></div>
    </div>
    <div class="chart-card" style="margin-top:12px">
      <div class="ct">🏪 消費熱點商家 Top 10</div>
      <div id="seller-rank-list"></div>
    </div>
    <div class="chart-card" style="margin-top:12px">
      <div class="ct">📅 消費日型態分析</div>
      <div id="day-pattern-chart"></div>
    </div>
  </div>

  <div class="panel" id="p-cat">
    <div class="chart-card">
      <div class="ct">分類支出</div>
      <div class="chart-wrap"><canvas id="pie-c"></canvas></div>
      <div class="legend" id="pie-leg"></div>
    </div>
    <!-- 分類明細下鑽 -->
    <div id="cat-drill" style="display:none">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <button onclick="closeDrill()" style="background:var(--card);border:1.5px solid var(--border);color:var(--t2);padding:7px 14px;border-radius:50px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit">← 返回</button>
        <div id="drill-title" style="font-size:1rem;font-weight:700"></div>
      </div>
      <!-- 第一層：子分類按鈕列表（始終可見） -->
      <div id="sub-list"></div>
      <!-- 第二層：選定子分類的明細（展開時顯示） -->
      <div id="drill-detail" style="display:none;margin-top:4px"></div>
    </div>
  </div>

  <div class="panel" id="p-mon">
    <div class="chart-card">
      <div class="ct">每月支出趨勢</div>
      <div class="chart-wrap"><canvas id="bar-c"></canvas></div>
    </div>
    <div id="month-detail-wrap" style="display:none;margin-top:12px">
      <div class="chart-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div class="ct" id="month-detail-title" style="margin-bottom:0">每日支出</div>
          <button onclick="closeMDDetail()" style="background:none;border:none;color:var(--t3);font-size:.8rem;cursor:pointer;padding:2px 6px">✕</button>
        </div>
        <div class="chart-wrap" style="height:160px"><canvas id="day-bar-c"></canvas></div>
      </div>
      <div class="chart-card" style="margin-top:10px">
        <div class="ct" id="month-cal-title">日曆</div>
        <div id="month-cal-grid"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="p-bud">
    <div style="font-size:.78rem;color:var(--t2);margin-bottom:12px">輸入金額後自動儲存（本月數據）</div>
    <div id="bud-list"></div>
    <div id="bud-history" style="margin-top:16px"></div>
  </div>
</div>


  <div class="panel" id="p-tag">
    <div class="chart-card">
      <div class="ct">🔖 標籤支出分析</div>
      <div id="tag-analysis-list"></div>
    </div>
    <div class="chart-card" style="margin-top:12px">
      <div class="ct">🧠 想要 vs 需要</div>
      <div id="want-need-analysis"></div>
    </div>
    <div class="chart-card" style="margin-top:12px">
      <div class="ct">📊 想要/需要 歷史趨勢</div>
      <div id="want-need-history"></div>
    </div>
    <div class="chart-card" style="margin-top:12px">
      <div class="ct">💰 省錢大作戰 - 消費分析</div>
      <div id="impulse-analysis"></div>
    </div>
  </div>

<div style="height:120px"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
Chart.defaults.color='#8896b3';
Chart.defaults.font.family="'Noto Sans TC',sans-serif";
const COLS=['#00e5b4','#4f8ef7','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#84cc16','#f97316','#94a3b8'];
let pieC=null,barC=null,personC=null,txData=[];
window._drillCatId='';
window._inlineCatId='';
window._inlineSubName='';

function init(){
  applyTheme();

  const savedState = sessionStorage.getItem('report_edit_state');
  if (savedState) {
    sessionStorage.removeItem('report_edit_state');
    try {
      const s = JSON.parse(savedState);
      if (s.df) document.getElementById('df').value = s.df;
      if (s.dt) document.getElementById('dt').value = s.dt;
      clearPresetHighlight();

      // 等 renderPie 渲染完（callback）再恢復展開狀態，避免 timing 問題
      load(() => {
        const panelKey = s.panel || 'ov';
        const tabBtns = Array.from(document.querySelectorAll('.tab'));
        const idxMap = { ov:0, cat:1, mon:2, bud:3, tag:4 };
        const targetBtn = tabBtns[idxMap[panelKey]];
        if (targetBtn) sw(panelKey, targetBtn);

        if (panelKey !== 'cat') {
          // 非分類 tab，無需恢復展開
        } else if (s.inlineCatId) {
          // 圖例內嵌展開流程（toggleSubCatInline → toggleTxDetail）
          const row = Array.from(document.querySelectorAll('#pie-leg .li'))
            .find(el => el.textContent.includes(catName(s.inlineCatId)));
          if (row) {
            toggleSubCatInline(s.inlineCatId, row);
            // toggleSubCatInline 是同步的，展開後 .sub-item 立刻存在
            if (s.inlineSubName) {
              const subItems = row.parentElement?.querySelectorAll('.sub-item') || [];
              const target = Array.from(subItems).find(
                el => (el.getAttribute('data-sub') || '') === s.inlineSubName
              );
              if (target) {
                toggleTxDetail(target, s.inlineCatId, s.inlineSubName);
                // 滾動到展開的子分類明細
                setTimeout(() => {
                  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 80);
              }
            } else {
              // 只恢復到分類層，不恢復子分類
              setTimeout(() => {
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }, 80);
            }
          }
        } else if (s.catId) {
          // 下鑽流程（drillCat → drillSubCat）
          drillCat(s.catId);
          if (s.subName) {
            drillSubCat(s.catId, s.subName);
            const detail = document.getElementById('drill-detail');
            if (detail) setTimeout(() => detail.scrollIntoView({ behavior:'smooth', block:'start' }), 80);

            // 自動跳下一筆（若有序列）
            const autoNext = sessionStorage.getItem('report_auto_next') === '1';
            if (autoNext) {
              sessionStorage.removeItem('report_auto_next');
              try {
                const seq = JSON.parse(sessionStorage.getItem('report_edit_seq') || '[]');
                const cur = sessionStorage.getItem('report_edit_current') || '';
                const i = seq.indexOf(cur);
                const nextId = (i >= 0 && i < seq.length-1) ? seq[i+1] : '';
                if (nextId) {
                  sessionStorage.setItem('report_edit_current', nextId);
                  setTimeout(() => jumpToEditTx(nextId), 260);
                } else {
                  sessionStorage.removeItem('report_edit_seq');
                  sessionStorage.removeItem('report_edit_current');
                  toast('已編輯到此子分類最後一筆 ✅');
                }
              } catch(e) {}
            }
          }
        }
      });

      ['df','dt'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', () => clearPresetHighlight());
      });
      return;
    } catch(e) {}
  }

  // 預設初始化
  preset('month');
  load();
  renderWeekPred();
  ['df','dt'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => clearPresetHighlight());
  });
}

function clearPresetHighlight() {
  document.querySelectorAll('.pb[data-preset]').forEach(b => b.classList.remove('on'));
}

// 用本地時間格式化日期字串（避免 toISOString() 受 UTC 影響掉到前一天）
function toLocalISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function preset(t, el){
  const now=new Date();let f,e;
  if(t==='week'){
    // 本週：週一到週日
    const dow=now.getDay()||7;  // 週日=7
    f=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(dow-1));
    e=new Date(f.getFullYear(),f.getMonth(),f.getDate()+6);
  }
  else if(t==='month'){f=new Date(now.getFullYear(),now.getMonth(),1);e=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(t==='7'){f=new Date(now-7*864e5);e=now;}
  else if(t==='period'){const bp=getBudgetPeriod();f=bp.start;e=bp.end;}
  else{f=new Date(now.getFullYear(),now.getMonth()-2,1);e=now;}
  document.getElementById('df').value=toLocalISO(f);
  document.getElementById('dt').value=toLocalISO(e);

  // 高亮目前選中的快捷鍵（el 由按鈕傳入；init() 呼叫時自動找對應按鈕）
  clearPresetHighlight();
  const btn = el || document.querySelector(`.pb[data-preset="${t}"]`);
  if (btn) btn.classList.add('on');

  // 使用者點擊快捷鍵時自動 load（init() 呼叫時 el 為 undefined，跳過 load 讓 init 自己呼叫）
  if (el && typeof load === 'function') load();
}

function load(onPieDone){
  const f=document.getElementById('df').value,e=document.getElementById('dt').value;
  if(!f||!e){toast('請選擇日期','warn');return;}
  // 收合目前展開的卡片明細
  if(_expandedCardId) { collapseCard(_expandedCardId); _expandedCardId=null; }
  txData=txByRange(f,e);
  document.getElementById('range-lbl').textContent=`${f} ～ ${e}（${txData.length}筆）`;
  renderOv();renderPie(onPieDone);renderBar();renderBud();
}

function renderOv(){
  const s=calcStats(txData);
  document.getElementById('ov-t').textContent='$'+fmt(s.total);
  document.getElementById('ov-n').textContent=txData.length;
  document.getElementById('ov-cd').textContent='$'+fmt(s.card);
  document.getElementById('ov-cs').textContent='$'+fmt(s.cash);
  const acctEl = document.getElementById('ov-acct');
  const acctWrap = document.getElementById('ov-acct-wrap');
  if (acctEl && acctWrap) {
    acctEl.textContent = '$'+fmt(s.acct||0);
    acctWrap.style.display = (s.acct||0) > 0 ? '' : 'none';
  }
  const cp=s.total>0?Math.round(s.cash/s.total*100):0;
  document.getElementById('rbar-c').style.width=cp+'%';
  document.getElementById('rp-c').textContent=cp+'%';
  document.getElementById('rp-cc').textContent=(100-cp)+'%';
  const el=document.getElementById('cb-list');
  if(!Object.keys(s.byCard).length){el.innerHTML='<div style="color:var(--t3);font-size:.84rem;text-align:center;padding:8px">無信用卡消費</div>';}
  else{el.innerHTML=Object.entries(s.byCard).sort((a,b)=>b[1]-a[1]).map(([cid,amt])=>{
    // 孤兒記錄：pay=card 但 cardId 為空（資料異常，可能是 AI 多筆記帳舊 bug 或卡片被刪除）
    if (cid === '_orphan') {
      const pct = s.card>0 ? Math.round(amt/s.card*100) : 0;
      return `<div class="cb-item" data-card-id="_orphan" onclick="drillCard('_orphan')" style="cursor:pointer;border-radius:var(--rs);padding:10px;margin-bottom:4px;background:rgba(244,63,94,.08);border:1px dashed var(--warn)">
        <div class="cb-hdr" style="justify-content:space-between;align-items:center">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-weight:700;color:var(--warn)">⚠️ 未指定卡片</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-weight:900;color:var(--warn)">$${fmt(amt)}</span>
            <span class="cb-arrow" style="color:var(--t3);font-size:.85rem;transition:.2s">›</span>
          </div>
        </div>
        <div style="font-size:.7rem;color:var(--t3);margin-top:6px">付款方式為信用卡但未填卡片資料，點擊查看明細</div>
      </div>`;
    }
    const c=cardFind(cid);const pct=s.card>0?Math.round(amt/s.card*100):0;
    return `<div class="cb-item" data-card-id="${cid}" onclick="drillCard('${cid}')" style="cursor:pointer;transition:.15s;border-radius:var(--rs);padding:10px;margin-bottom:4px;background:var(--card)" onmouseenter="this.style.background='var(--card2)'" onmouseleave="this.style.background='var(--card)'">
      <div class="cb-hdr" style="justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:10px;height:10px;border-radius:50%;background:${c?.color||'var(--blue)'};flex-shrink:0"></div>
          <span style="font-weight:700">${c?c.name:cid}</span>
          <span style="font-size:.8rem;color:var(--t3)">···${c?.last4||'0000'}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-weight:900;color:${c?.color||'var(--blue)'} ">$${fmt(amt)}</span>
          <span class="cb-arrow" style="color:var(--t3);font-size:.85rem;transition:.2s">›</span>
        </div>
      </div>
      <div class="cb-bar" style="margin-top:8px"><div class="cb-fill" style="width:${pct}%;background:${c?.color||'var(--blue)'};height:5px;border-radius:3px"></div></div>
      <div style="font-size:.7rem;color:var(--t3);margin-top:3px;text-align:right">${pct}% · 點擊展開明細</div>
    </div>`;
  }).join('');}
  if(personC)personC.destroy();
  const p1=s.byPerson['宏龍']||0,p2=s.byPerson['盈慧']||0;
  personC=new Chart(document.getElementById('person-c'),{type:'doughnut',
    data:{labels:['宏龍','盈慧'],datasets:[{data:[p1,p2],backgroundColor:['#00e5b4','#4f8ef7'],borderColor:'#1a2235',borderWidth:3}]},
    options:{cutout:'65%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>`$${fmt(c.raw)} (${Math.round(c.raw/(p1+p2||1)*100)}%)`}}}}});
  renderDayPattern();
}

// ── 消費日型態分析 ─────────────────────────────────────────
function renderDayPattern() {
  const el = document.getElementById('day-pattern-chart');
  if (!el) return;
  if (!txData.length) { el.innerHTML = '<div style="color:var(--t3);font-size:.8rem;text-align:center;padding:12px">此區間無消費記錄</div>'; return; }

  const stats = getDayPatternStats(txData);
  const maxAvg = Math.max(...stats.map(s => s.avg), 1);
  // 週一排第一（index 1~6, 0=週日排最後）
  const ordered = [...stats.slice(1), stats[0]];

  const bars = ordered.map(s => {
    const h = Math.round(s.avg / maxAvg * 52);
    const color = s.isHot ? '#ef4444' : 'var(--p)';
    const hotBadge = s.isHot ? `<div style="font-size:.58rem;color:#ef4444;font-weight:700">🔥</div>` : '';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
      ${hotBadge}
      <div style="width:100%;height:58px;display:flex;align-items:flex-end;justify-content:center">
        <div title="${s.day} 週均 $${fmt(s.avg)}" style="width:65%;height:${Math.max(h,2)}px;background:${color};border-radius:3px 3px 0 0;transition:.3s"></div>
      </div>
      <div style="font-size:.64rem;color:var(--t3)">${s.day.slice(1)}</div>
      <div style="font-size:.66rem;color:var(--t2);font-weight:700">$${fmt(s.avg)}</div>
    </div>`;
  }).join('');

  const hotDays = ordered.filter(s => s.isHot).map(s => s.day);
  const insight = hotDays.length
    ? `<div style="margin-top:10px;padding:8px 10px;background:rgba(239,68,68,.1);border-radius:8px;font-size:.76rem;color:#ef4444">
        🔥 ${hotDays.join('、')}的花費明顯偏高，注意這幾天的衝動消費
      </div>`
    : `<div style="margin-top:10px;font-size:.74rem;color:var(--t3);text-align:center">各天消費較均勻 ✅</div>`;

  el.innerHTML = `
    <div style="display:flex;gap:3px;align-items:flex-end">${bars}</div>
    <div style="font-size:.68rem;color:var(--t3);text-align:center;margin-top:4px">週均消費（此查詢區間）</div>
    ${insight}`;
}

function renderPie(onDone){
  const s=calcStats(txData);const ent=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  if(pieC)pieC.destroy();
  if(!ent.length){document.getElementById('pie-leg').innerHTML='<div class="empty"><div class="ei">📊</div><p>無資料</p></div>';if(onDone)onDone();return;}
  const labs=ent.map(([id])=>catName(id)),vals=ent.map(([,v])=>v),cols=ent.map(([id],i)=>catFind(id).color||COLS[i%COLS.length]);
  pieC=new Chart(document.getElementById('pie-c'),{type:'doughnut',
    data:{labels:labs,datasets:[{data:vals,backgroundColor:cols,borderColor:'#1a2235',borderWidth:3}]},
    options:{cutout:'58%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`$${fmt(c.raw)} (${Math.round(c.raw/(s.total||1)*100)}%)`}}}}});
  document.getElementById('pie-leg').innerHTML=ent.map(([id,amt],i)=>{
    const pct=s.total>0?Math.round(amt/s.total*100):0;
    return `<div>
      <div class="li" onclick="toggleSubCatInline('${id}',this)" style="cursor:pointer;transition:.15s" onmouseenter="this.style.background='var(--card2)'" onmouseleave="this.style.background=''">
        <div class="ldot" style="background:${cols[i]}"></div>
        <span class="lname">${catName(id)}</span>

// ── 子分類內嵌展開 ──────────────────────────────────────
function toggleSubCatInline(catId, rowEl) {
  const container = rowEl.parentElement;
  const expand = container.querySelector('.sub-expand');
  const arrow  = rowEl.querySelector('.sub-arrow');
  const isOpen = expand.style.display !== 'none';
  // 關閉所有其他展開
  document.querySelectorAll('#pie-leg .sub-expand').forEach(el => { el.style.display='none'; });
  document.querySelectorAll('#pie-leg .sub-arrow').forEach(el => { el.textContent='▸'; });
  if (isOpen) return; // 原本開著就關掉
  window._inlineCatId = catId;
  window._inlineSubName = '';
  // 渲染子分類
  const txs = txData.filter(t => t.cat === catId);
  const total = txs.reduce((s,t)=>s+t.amount,0);
  const subMap = {};
  txs.forEach(t=>{
    const k = t.subCat||'（未分類）';
    if(!subMap[k]) subMap[k]={total:0,count:0};
    subMap[k].total += t.amount;
    subMap[k].count++;
  });
  const subEnts = Object.entries(subMap).sort((a,b)=>b[1].total-a[1].total);
  const cat = catFind(catId);
  // 把子分類 list 存到 expand，方便第三層查詢
  expand._txData = txData.filter(t => t.cat === catId);
  expand._catId  = catId;
  expand.innerHTML = subEnts.map(([sub,data])=>{
    const pct = total>0 ? Math.round(data.total/total*100) : 0;
    const escapedSub = sub.replace(/'/g,"\\'");
    return `<div class="sub-item" data-sub="${escapedSub}" data-cat="${catId}"
      onclick="toggleTxDetail(this,'${catId}','${escapedSub}')"
      style="margin-bottom:6px;border-radius:8px;background:var(--card);
             border-left:3px solid ${cat.color||'var(--p)'};cursor:pointer;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px">
        <div>
          <span style="font-size:.84rem;font-weight:700">${sub}</span>
          <span style="font-size:.7rem;color:var(--t3);margin-left:6px">${data.count}筆 · ${pct}%</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-weight:900;color:var(--danger);font-size:.88rem">$${fmt(data.total)}</span>
          <span class="tx-arrow" style="font-size:.75rem;color:var(--t3);transition:.2s">▸</span>
        </div>
      </div>
      <div class="tx-detail-expand" style="display:none;padding:0 10px 8px"></div>
    </div>`;
  }).join('');
  expand.style.display = 'block';
  arrow.textContent = '▾';
}

function toggleTxDetail(itemEl, catId, subName) {
  const detailEl = itemEl.querySelector('.tx-detail-expand');
  const arrowEl  = itemEl.querySelector('.tx-arrow');
  const isOpen = detailEl.style.display !== 'none';

let _openSubName = '';

    ? allTxs.filter(t=>!t.subCat)

        <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--t3);padding:3px 4px;margin-bottom:6px;border-bottom:1px solid var(--border)">

// 記錄目前展開哪張卡
let _expandedCardId = null;

function drillCard(cardId) {
  // 如果已展開同一張卡，就收合
  if (_expandedCardId === cardId) {
    collapseCard(cardId);
    return;
  }
  // 先收合上一張
  if (_expandedCardId) collapseCard(_expandedCardId);
  _expandedCardId = cardId;

  // 孤兒記錄特殊處理：顯示為「未指定卡片」
  const isOrphan = cardId === '_orphan';
  const card = isOrphan
    ? {name:'未指定卡片', last4:'????', color:'var(--warn)'}
    : (cardFind(cardId) || {name:'信用卡', last4:'????', color:'var(--blue)'});

  // 用頁面上的日期範圍篩選
  const f = document.getElementById('df').value;
  const e = document.getElementById('dt').value;
  const start = new Date(f), end = new Date(e);
  end.setHours(23,59,59,999);
  const txs = getTx().filter(t => {
    const d = new Date(t.at);
    if (d < start || d > end) return false;
    if (t.pay !== 'card') return false;
    // 孤兒：cardId 為空，或有 cardId 但找不到對應卡片（已刪除）
    if (isOrphan) return !t.cardId || !cardFind(t.cardId);
    return t.cardId === cardId;
  });
  const total = txs.reduce((s,t) => s+t.amount, 0);

  // 按日期分組
  const groups = {};
  [...txs].sort((a,b) => new Date(b.at)-new Date(a.at)).forEach(t => {
    const d = fmtD(t.at);
    if (!groups[d]) groups[d] = [];
    groups[d].push(t);
  });

  const detailHtml = Object.keys(groups).length === 0
    ? '<div style="color:var(--t3);font-size:.84rem;padding:12px 4px">此區間無消費記錄</div>'
    : Object.entries(groups).map(([day, list]) => {
        const dayTotal = list.reduce((s,t) => s+t.amount, 0);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--t3);padding:4px 0 6px;border-bottom:1px solid var(--border)">
            <span>📅 ${day}</span><span>-$${fmt(dayTotal)}</span>
          </div>
          ${list.map(t => `
            <div onclick="jumpToEditTx('${t.id}')" style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(42,53,80,.25);cursor:pointer;transition:background .12s;border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px" onmouseenter="this.style.background='var(--card2)'" onmouseleave="this.style.background=''">
              <div style="width:34px;height:34px;border-radius:9px;background:${catFind(t.cat).color||'var(--card2)'};display:flex;align-items:center;justify-content:center;font-size:.82rem;flex-shrink:0;opacity:.85">${catFind(t.cat).name.slice(0,2)}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHTML(t.detail || catName(t.cat))}</div>
                <div style="font-size:.68rem;color:var(--t3);margin-top:1px">${escapeHTML(catName(t.cat))}${t.subCat ? ' · '+escapeHTML(t.subCat) : ''} · ${escapeHTML(t.person||'')} · ${fmtT(t.at)}</div>
              </div>
              <div style="font-size:.9rem;font-weight:900;color:${card.color||'var(--blue)'};flex-shrink:0">-$${fmt(t.amount)}</div>
              <div style="color:var(--t3);font-size:.85rem;flex-shrink:0">✏️</div>
            </div>`).join('')}
        </div>`;
      }).join('');

  // 插入到該卡片 cb-item 下方
  const cbItem = document.querySelector(`[data-card-id="${cardId}"]`);
  if (!cbItem) return;

  // 更新箭頭方向
  const arrow = cbItem.querySelector('.cb-arrow');
  if (arrow) arrow.textContent = '∨';

  const detailDiv = document.createElement('div');
  detailDiv.id = 'card-detail-' + cardId;
  detailDiv.style.cssText = 'padding:10px 4px 4px;border-top:1px solid var(--border);margin-top:8px;animation:fadeIn .2s ease';
  detailDiv.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:.78rem;font-weight:700;color:var(--t2)">💳 ${card.name} ···${card.last4} 全部消費</div>
      <div style="font-size:.78rem;font-weight:900;color:${card.color||'var(--blue)'}">共 $${fmt(total)}（${txs.length}筆）</div>
    </div>
    ${detailHtml}`;
  cbItem.appendChild(detailDiv);
}

function collapseCard(cardId) {
  const detail = document.getElementById('card-detail-' + cardId);
  if (detail) detail.remove();
  const cbItem = document.querySelector(`[data-card-id="${cardId}"]`);
  const arrow = cbItem && cbItem.querySelector('.cb-arrow');
  if (arrow) arrow.textContent = '›';
  if (_expandedCardId === cardId) _expandedCardId = null;

// ── 月份點擊：每日長條+曲線+日曆 ──────────────────────────
let dayBarC = null;
function renderMonthDetail(monthKey) {
  // monthKey: 'YYYY/MM'
  const [y, m] = monthKey.split('/').map(Number);
  const txs = txByMonth(y, m);
  const daysInMonth = new Date(y, m, 0).getDate();

  // 建每日金額陣列
  const dayAmt = Array(daysInMonth).fill(0);
  txs.forEach(t => { const d = new Date(t.at); dayAmt[d.getDate()-1] += t.amount; });
  const labels = Array.from({length: daysInMonth}, (_,i) => i+1);

  // 標題
  document.getElementById('month-detail-title').textContent = `${y}/${m} 每日支出`;
  document.getElementById('month-cal-title').textContent = `${y}年${m}月 日曆`;

  // 每日長條+曲線圖
  if (dayBarC) dayBarC.destroy();
  const ctx = document.getElementById('day-bar-c');
  // 讀取目前主題色
  const themeP = getComputedStyle(document.documentElement).getPropertyValue('--p').trim() || '#00e5b4';
  const hex2rgba = (hex, a) => {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  };
  // --p 可能是 #rrggbb 或其他格式，容錯處理

function renderMonthCal(y, m, dayAmt) {
  const grid = document.getElementById('month-cal-grid');
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = new Date(y, m-1, 1).getDay(); // 0=日
  const maxAmt = Math.max(...dayAmt, 1);
  const today = new Date();

  let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px">';
  ['日','一','二','三','四','五','六'].forEach(d => {
    html += `<div style="text-align:center;font-size:.65rem;color:var(--t3);padding:2px 0">${d}</div>`;
  });
  html += '</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';

  // 空格補位
  for (let i = 0; i < firstDow; i++) html += '<div></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const amt = dayAmt[d-1];
    const isToday = today.getFullYear()===y && today.getMonth()+1===m && today.getDate()===d;
    const intensity = amt > 0 ? Math.max(0.15, amt / maxAmt) : 0;
    // 日曆格子跟隨主題色
    const calP = getComputedStyle(document.documentElement).getPropertyValue('--p').trim() || '#00e5b4';
    const calHex = calP.startsWith('#') && calP.length===7 ? calP : '#00e5b4';
    const cr = parseInt(calHex.slice(1,3),16), cg = parseInt(calHex.slice(3,5),16), cb = parseInt(calHex.slice(5,7),16);
    const bg = amt > 0 ? `rgba(${cr},${cg},${cb},${intensity.toFixed(2)})` : 'var(--card2)';
    const txtColor = intensity > 0.6 ? '#000' : 'var(--t)';
    const border = isToday ? '1.5px solid var(--p)' : '1px solid var(--border)';
    html += `<div onclick="goToDateList('${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}')"
      style="border-radius:6px;padding:4px 2px;text-align:center;cursor:${amt>0?'pointer':'default'};
             background:${bg};border:${border};min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:.72rem;font-weight:${isToday?'900':'400'};color:${isToday?'var(--p)':txtColor}">${d}</div>
      ${amt > 0 ? `<div style="font-size:.58rem;color:${txtColor};margin-top:1px">$${fmt(amt)}</div>` : ''}
    </div>`;
  }
  html += '</div>';
  grid.innerHTML = html;
}

function getMonthPrediction() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = now.getDate();
  const daysLeft = daysInMonth - today;

  const allTx = getTx();
  const thisMonthTx = txByMonth(y, m);
  const totalSpent = thisMonthTx.reduce((s,t) => s+t.amount, 0);

  // 歷史日均（今天之前）
  const todayStart = new Date(now); todayStart.setHours(0,0,0,0);
  const histTx = allTx.filter(t => new Date(t.at) < todayStart);
  let histDays = 0;
  if (histTx.length > 0) {
    const oldest = new Date(Math.min(...histTx.map(t => new Date(t.at))));
    histDays = Math.max(1, Math.ceil((todayStart - oldest) / 86400000));
  }

  const cats = getCats();
  const catResults = cats.map(cat => {
    const spentThisMonth = thisMonthTx.filter(t=>t.cat===cat.id).reduce((s,t)=>s+t.amount, 0);
    let predicted = 0;
    if (histTx.length > 0 && histDays > 0) {
      const histTotal = histTx.filter(t=>t.cat===cat.id).reduce((s,t)=>s+t.amount, 0);
      predicted = Math.round(histTotal / histDays * daysLeft);
    }
    return { cat, spentThisWeek: spentThisMonth, predicted, total: spentThisMonth + predicted };
  }).filter(r => r.spentThisWeek > 0 || r.predicted > 0);

  const totalPredicted = catResults.reduce((s,r) => s+r.predicted, 0);
  return { daysLeft, totalSpent, totalPredicted, catResults };
}

    if (!d || d.length < 2) continue;
    let matched = null;
    for (const key of Object.keys(groups)) {
      if (d.includes(key) || key.includes(d)) { matched = key; break; }
    }
    if (matched) {
      const rep = d.length < matched.length ? d : matched;
      if (rep !== matched) { groups[rep] = groups[matched]; delete groups[matched]; }
      groups[rep].total += tx.amount;
      groups[rep].count++;
    } else {
      groups[d] = { total: tx.amount, count: 1 };
    }
  }
  const sorted = Object.entries(groups).sort((a, b) => b[1].total - a[1].total).slice(0, 10);
  if (!sorted.length) {
    el.innerHTML = '<div style="color:var(--t3);font-size:.84rem;text-align:center;padding:16px">此區間無填寫商家/明細的記錄</div>';
    return;
  }
  const maxAmt = sorted[0][1].total;
  // 取全庫歷史（用 getTx 而非 txData，這樣可以看跨月趨勢）
  const allTxForTrend = typeof getTx === 'function' ? getTx() : txData;
  el.innerHTML = sorted.map(([name, data], i) => {
    const pct    = maxAmt > 0 ? Math.round(data.total / maxAmt * 100) : 0;
    const medals = ['🥇','🥈','🥉'];
    const rank   = i < 3 ? medals[i]
      : `<span style="font-size:.75rem;color:var(--t3);min-width:18px;text-align:center;display:inline-block">${i+1}</span>`;

    // 歷史價格趨勢（全庫匹配）
    const hist = allTxForTrend
      .filter(t => t.detail && (t.detail.includes(name) || name.includes(t.detail)))
      .sort((a, b) => new Date(a.at) - new Date(b.at))
      .slice(-20);
    const amounts = hist.map(t => t.amount);
    let trendTag = '';
    if (amounts.length >= 4) {
      const recent = amounts.slice(-3).reduce((s,a)=>s+a,0)/3;
      const older  = amounts.slice(0,-3).reduce((s,a)=>s+a,0)/(amounts.length-3);
      if (recent > older * 1.15)       trendTag = `<span style="font-size:.66rem;color:#ef4444;margin-left:4px">📈 漲價</span>`;
      else if (recent < older * 0.85)  trendTag = `<span style="font-size:.66rem;color:#22c55e;margin-left:4px">📉 降價</span>`;
    }

    // 迷你折線（SVG）
    let miniChart = '';
    if (amounts.length >= 3) {
      const mMax = Math.max(...amounts), mMin = Math.min(...amounts);
      const range = mMax - mMin || 1;
      const W = 80, H = 22;
      const pts = amounts.map((a, i) => {
        const x = Math.round(i / (amounts.length - 1) * W);
        const y = Math.round((1 - (a - mMin) / range) * (H - 4) + 2);
        return `${x},${y}`;
      }).join(' ');
      miniChart = `<svg width="${W}" height="${H}" style="flex-shrink:0;margin-left:8px" viewBox="0 0 ${W} ${H}">
        <polyline fill="none" stroke="var(--p)" stroke-width="1.5" points="${pts}"/>
        <circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="2" fill="var(--p)"/>
      </svg>`;
    }

    return `<div style="margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:6px;min-width:0;flex:1">
          <span style="flex-shrink:0">${rank}</span>
          <span style="font-size:.86rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
          ${trendTag}
        </div>
        <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:8px">
          ${miniChart}
          <div style="text-align:right">
            <div style="font-weight:900;color:var(--p);font-size:.9rem">$${fmt(data.total)}</div>
            <div style="font-size:.68rem;color:var(--t3)">${data.count}筆 均$${fmt(Math.round(data.total/data.count))}</div>
          </div>
        </div>
      </div>
      <div style="height:4px;background:var(--border);border-radius:2px">
        <div style="height:4px;width:${pct}%;background:var(--p);border-radius:2px;transition:.3s"></div>
      </div>
    </div>`;
  }).join('');
}

// ── 想要 vs 需要分析 ─────────────────────────────────────
function renderWantNeed() {
  const el = document.getElementById('want-need-analysis');
  if (!el) return;
  if (!txData.length) {
    el.innerHTML = '<div style="color:var(--t3);font-size:.84rem;text-align:center;padding:16px">此區間無消費記錄</div>';
    return;
  }
  // want 標籤 id = 'want'；impulse/emotion/social 歸入衝動；其餘為需要
  let wantAmt = 0, wantCnt = 0;
  let impulseAmt = 0, impulseCnt = 0;
  let needAmt = 0, needCnt = 0;
  const WANT_TAGS = new Set(['want']);
  const IMPULSE_TAGS = new Set(['impulse', 'emotion', 'social']);
  for (const tx of txData) {
    const tags = tx.tags || [];
    const hasWant    = tags.some(id => WANT_TAGS.has(id));
    const hasImpulse = tags.some(id => IMPULSE_TAGS.has(id));
    if (hasWant || hasImpulse) {
      if (hasImpulse) { impulseAmt += tx.amount; impulseCnt++; }
      else            { wantAmt    += tx.amount; wantCnt++;    }
    } else {
      needAmt += tx.amount; needCnt++;
    }
  }
  const total = wantAmt + impulseAmt + needAmt;
  if (total === 0) {
    el.innerHTML = '<div style="color:var(--t3);font-size:.84rem;text-align:center;padding:16px">此區間無消費記錄</div>';
    return;
  }
  const wantPct    = Math.round(wantAmt    / total * 100);
  const impulsePct = Math.round(impulseAmt / total * 100);
  const needPct    = 100 - wantPct - impulsePct;
  // 顏色
  const C_NEED = '#00e5b4', C_WANT = '#4f8ef7', C_IMP = '#f59e0b';
  const bars = [
    { label: '✅ 需要', amt: needAmt,    cnt: needCnt,    pct: needPct,    color: C_NEED },
    { label: '💝 想要', amt: wantAmt,    cnt: wantCnt,    pct: wantPct,    color: C_WANT },
    { label: '⚡ 衝動', amt: impulseAmt, cnt: impulseCnt, pct: impulsePct, color: C_IMP  },
  ];
  // 小提示語
  const nonNeedPct = wantPct + impulsePct;
  let tip = '';
  if (nonNeedPct === 0)       tip = '🎉 這段期間全是必要支出，超自律！';
  else if (nonNeedPct <= 10)  tip = '👍 非必要消費控制得很好，繼續保持！';
  else if (nonNeedPct <= 25)  tip = '💡 非必要消費佔 ' + nonNeedPct + '%，仍在合理範圍。';
  else if (nonNeedPct <= 40)  tip = '⚠️ 非必要消費達 ' + nonNeedPct + '%，可以留意一下衝動消費喔。';
  else                        tip = '🚨 非必要消費高達 ' + nonNeedPct + '%，建議下週更有意識地記帳。';

  // 視覺：橫條圖 + 數字卡
  el.innerHTML = `
    <div style="margin-bottom:12px">
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px">
        ${bars.filter(b=>b.pct>0).map(b=>`<div style="width:${b.pct}%;background:${b.color};transition:.4s" title="${b.label} ${b.pct}%"></div>`).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
      ${bars.map(b=>`
        <div style="background:${b.color}18;border:1px solid ${b.color}44;border-radius:10px;padding:9px 10px;text-align:center">
          <div style="font-size:.72rem;color:var(--t3);margin-bottom:2px">${b.label}</div>
          <div style="font-size:1rem;font-weight:900;color:${b.color}">${b.pct}%</div>
          <div style="font-size:.68rem;color:var(--t3);margin-top:1px">$${fmt(b.amt)}</div>
        </div>`).join('')}
    </div>
    <div style="font-size:.78rem;color:var(--t2);background:var(--card2);border-radius:8px;padding:9px 12px">
      ${tip}
    </div>
    <div style="font-size:.7rem;color:var(--t3);margin-top:8px;padding:0 2px">
      💡 需要 = 無衝動/情緒/想要標籤的消費。若要提升準確度，請在記帳時標記消費動機。
    </div>`;
  renderWantNeedHistory();
}

function renderWantNeedHistory() {
  const el = document.getElementById('want-need-history');
  if (!el || typeof getWantNeedHistory !== 'function') return;

  const periods = getWantNeedHistory(4);
  // 若全部都沒有標籤資料，顯示提示
  const hasData = periods.some(p => p.tagRate > 0);
  if (!hasData) {
    el.innerHTML = `<div style="font-size:.78rem;color:var(--t3);text-align:center;padding:12px">
      目前標籤紀錄較少，記帳時多加上「需要／想要／衝動」標籤，趨勢圖就會越來越準確。
    </div>`;
    return;
  }

  const C = { need:'#00e5b4', want:'#4f8ef7', impulse:'#f59e0b' };
  const maxTotal = Math.max(...periods.map(p => p.total), 1);

  const bars = periods.map(p => {
    const barH = Math.round(p.total / maxTotal * 60); // px，最高 60
    const needH    = Math.round(barH * p.needPct    / 100);
    const wantH    = Math.round(barH * p.wantPct    / 100);
    const impulseH = Math.max(0, barH - needH - wantH);
    const impPctLabel = p.impulsePct > 0 ? `<div style="font-size:.58rem;color:${C.impulse}">⚡${p.impulsePct}%</div>` : '';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
      ${impPctLabel}
      <div style="width:100%;height:70px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">
        <div style="width:72%;display:flex;flex-direction:column;gap:1px;border-radius:4px 4px 0 0;overflow:hidden">
          ${impulseH > 0 ? `<div style="height:${impulseH}px;background:${C.impulse}"></div>` : ''}
          ${wantH    > 0 ? `<div style="height:${wantH}px;background:${C.want}"></div>` : ''}
          ${needH    > 0 ? `<div style="height:${needH}px;background:${C.need}"></div>` : ''}
        </div>
      </div>
      <div style="font-size:.62rem;color:var(--t3);margin-top:2px">${p.label}</div>
      <div style="font-size:.65rem;color:var(--t2)">$${fmt(Math.round(p.total/1000))}k</div>
    </div>`;
  }).join('');

  const legend = `<div style="display:flex;gap:12px;font-size:.7rem;margin-bottom:10px">
    <span><span style="display:inline-block;width:10px;height:10px;background:${C.need};border-radius:2px;margin-right:3px"></span>需要</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:${C.want};border-radius:2px;margin-right:3px"></span>想要</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:${C.impulse};border-radius:2px;margin-right:3px"></span>衝動</span>
  </div>`;

  // 趨勢解讀
  const latest = periods[periods.length - 1];
  const prev   = periods[periods.length - 2];
  let trend = '';
  if (prev && latest) {
    const impDiff = latest.impulsePct - prev.impulsePct;
    if      (impDiff >=  5) trend = `<div style="font-size:.76rem;color:#f59e0b;margin-top:8px">⚠️ 衝動消費比上期增加 ${impDiff}%，留意一下</div>`;
    else if (impDiff <= -5) trend = `<div style="font-size:.76rem;color:#22c55e;margin-top:8px">✅ 衝動消費比上期減少 ${Math.abs(impDiff)}%，繼續保持！</div>`;
  }

  el.innerHTML = `${legend}<div style="display:flex;gap:4px;align-items:flex-end">${bars}</div>${trend}`;
}

// ── 標籤分析 ──────────────────────────────────────────
window._expandedTagId = null;
function renderTagAnalysis() {
  const tags = getTxTags();
  const stats = calcTagStats(txData);
  const el = document.getElementById('tag-analysis-list');

  if (!Object.keys(stats).length) {
    el.innerHTML = '<div style="color:var(--t3);font-size:.84rem;text-align:center;padding:16px">此區間無消費標籤記錄</div>';
  } else {
    const sorted = Object.entries(stats).sort((a,b)=>b[1].total-a[1].total);
    const grandTotal = txData.reduce((s,t)=>s+t.amount,0);
    el.innerHTML = sorted.map(([tagId, data]) => {
      const tag = getTxTagById(tagId);
      if (!tag) return '';
      const pct = grandTotal > 0 ? Math.round(data.total/grandTotal*100) : 0;
      const expanded = window._expandedTagId === tagId;
      const detailHtml = expanded ? renderTagDetailList(data.list, tag) : '';
      return `<div style="margin-bottom:14px">
        <div data-tag-row="${tagId}" style="cursor:pointer;padding:4px;margin:-4px;border-radius:6px;transition:.15s">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:.88rem;font-weight:700;color:${tag.color}">
              ${expanded ? '▾' : '▸'} ${tag.label}
            </span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:.72rem;color:var(--t3)">${data.count}筆 · ${pct}%</span>
              <span style="font-weight:900;color:var(--danger)">$${fmt(data.total)}</span>
            </div>
          </div>
          <div style="height:5px;background:var(--border);border-radius:3px">
            <div style="height:5px;width:${pct}%;background:${tag.color};border-radius:3px;transition:.3s"></div>
          </div>
        </div>
        ${detailHtml}
      </div>`;
    }).join('');

    // 綁定 click 事件（用 addEventListener 確保在手機可靠）
    el.querySelectorAll('[data-tag-row]').forEach(row => {
      row.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const tid = this.getAttribute('data-tag-row');
        window._expandedTagId = (window._expandedTagId === tid) ? null : tid;
        renderTagAnalysis();
      });
    });
  }

  // 省錢大作戰 - 消費分析（衝動 + 情緒 + 社交壓力 + 想要）
  const impulseEl = document.getElementById('impulse-analysis');
  const combined = [
    ...(stats['impulse']?.list||[]),
    ...(stats['emotion']?.list||[]),
    ...(stats['social']?.list||[]),
    ...(stats['want']?.list||[]),
  ].filter((t,i,a)=>a.findIndex(x=>x.id===t.id)===i);

  const totalAmt = combined.reduce((s,t)=>s+t.amount,0);
  const dayCount = (() => {
    const f = document.getElementById('df')?.value;
    const e = document.getElementById('dt')?.value;
    if (!f||!e) return 30;
    return Math.max(1, Math.ceil((new Date(e)-new Date(f))/86400000)+1);
  })();

  if (totalAmt === 0) {
    impulseEl.innerHTML = '<div style="color:var(--t3);font-size:.84rem;text-align:center;padding:16px">此區間無衝動/情緒/社交壓力/想要 消費 🎉</div>';
  } else {
    impulseEl.innerHTML = `
      <div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:12px 14px;margin-bottom:12px">
        <div style="font-size:.78rem;color:var(--t3);margin-bottom:4px">⚡衝動 + 😔情緒 + 👥社交壓力 + 💝想要 合計</div>
        <div style="font-size:1.3rem;font-weight:900;color:#f59e0b">$${fmt(totalAmt)}</div>
        <div style="font-size:.75rem;color:var(--t3);margin-top:3px">${combined.length}筆消費</div>
      </div>
      <div style="background:rgba(0,229,180,.1);border:1px solid rgba(0,229,180,.2);border-radius:10px;padding:12px 14px;margin-bottom:12px">
        <div style="font-size:.78rem;color:var(--t3);margin-bottom:4px">💡 如果當初忍住，可以省下</div>
        <div style="font-size:1.3rem;font-weight:900;color:var(--p)">$${fmt(totalAmt)}</div>
        <div style="font-size:.75rem;color:var(--t3);margin-top:3px">約 ${Math.round(totalAmt/dayCount)} 元/天</div>
      </div>
      <div style="font-size:.78rem;font-weight:700;color:var(--t2);margin-bottom:8px">相關消費明細</div>
      ${[...combined].sort((a,b)=>b.amount-a.amount).slice(0,8).map(t=>{
        const tagLabels = (t.tags||[]).map(id=>{const tg=getTxTagById(id);return tg?tg.label:'';}).filter(Boolean).join(' ');
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-size:.84rem;font-weight:600">${t.detail||catName(t.cat)}</div>
            <div style="font-size:.68rem;color:var(--t3);margin-top:2px">${fmtD(t.at)} · ${t.person} · ${tagLabels}</div>
          </div>
          <div style="font-size:.9rem;font-weight:900;color:#f59e0b">$${fmt(t.amount)}</div>
        </div>`;
      }).join('')}`;
  }
}


function buildCurrentDrillSequence() {
  if (document.getElementById('cat-drill')?.style?.display !== 'none' && window._drillCatId && _openSubName) {
    const list = txData.filter(t => t.cat===window._drillCatId && (_openSubName==='（未分類）' ? !t.subCat : t.subCat===_openSubName));
    return [...list].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(t=>t.id);
  }
  if (window._inlineCatId && window._inlineSubName) {
    const list = txData.filter(t => t.cat===window._inlineCatId && (window._inlineSubName==='（未分類）' ? !t.subCat : t.subCat===window._inlineSubName));
    return [...list].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(t=>t.id);
  }
  return [];
}

// ── 跳轉到列表頁編輯指定的記帳 ─────────────────────────
function jumpToEditTx(txId) {
  if (!txId) return;
  // 儲存完整查詢狀態：日期區間 + 目前 tab
  const state = {
    df: document.getElementById('df')?.value || '',
    dt: document.getElementById('dt')?.value || '',
    panel: document.querySelector('.panel.on')?.id?.replace('p-','') || 'ov',
    catId: document.getElementById('cat-drill')?.style?.display !== 'none' ? (window._drillCatId || '') : '',
    subName: window._openSubName || '',
    inlineCatId: window._inlineCatId || '',
    inlineSubName: window._inlineSubName || '',
  };
  const seq = buildCurrentDrillSequence();
  if (seq.length) {
    sessionStorage.setItem('report_edit_seq', JSON.stringify(seq));
    sessionStorage.setItem('report_edit_current', txId);
  }
  sessionStorage.setItem('report_edit_tx', txId);
  sessionStorage.setItem('report_edit_state', JSON.stringify(state));
  sessionStorage.setItem('report_edit_return', '1');
  location.href = './index.html';
}

// 渲染標籤展開的明細列表
function renderTagDetailList(list, tag) {
  if (!list || !list.length) return '';
  const sorted = [...list].sort((a,b)=>new Date(b.at)-new Date(a.at));
  return `<div style="margin-top:8px;padding:10px 12px;background:${tag.color}14;border-left:3px solid ${tag.color};border-radius:6px">
    ${sorted.map(t => `
      <div onclick="jumpToEditTx('${t.id}')" style="display:flex;align-items:center;justify-content:space-between;padding:7px 6px;border-bottom:1px solid ${tag.color}22;cursor:pointer;transition:background .12s;border-radius:6px;margin:0 -6px;gap:8px" onmouseenter="this.style.background='${tag.color}1f'" onmouseleave="this.style.background=''">
        <div style="flex:1;min-width:0">
          <div style="font-size:.82rem;font-weight:600">${t.detail||catName(t.cat)}</div>
          <div style="font-size:.68rem;color:var(--t3);margin-top:2px">${fmtD(t.at)} · ${catName(t.cat)} · ${t.person}</div>
        </div>
        <div style="font-size:.88rem;font-weight:900;color:var(--danger);flex-shrink:0">$${fmt(t.amount)}</div>
        <div style="color:var(--t3);font-size:.85rem;flex-shrink:0">✏️</div>
      </div>
    `).join('')}
  </div>`;
}
