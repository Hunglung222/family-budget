<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>🔒 私密記帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<style>
  /* 浮動新增按鈕 */
  .priv-fab {
    position: fixed;
    right: 18px;
    bottom: calc(var(--nav) + 18px);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--p), var(--p2));
    color: #000;
    border: none;
    font-size: 1.8rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(99,102,241,.45);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .priv-fab:active { transform: scale(.92); }

  /* Bottom sheet 全屏 modal */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
  }
  .sheet-overlay.show { display: block; }
  .sheet-container {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 92vh;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    z-index: 101;
    display: none;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .25s ease-out;
    box-shadow: 0 -8px 30px rgba(0,0,0,.4);
  }
  .sheet-container.show { display: flex; transform: translateY(0); }
  .sheet-header {
    flex-shrink: 0;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    background: var(--card);
    border-radius: 18px 18px 0 0;
  }
  .sheet-header-title {
    flex: 1;
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--t);
  }
  .sheet-close-btn {
    padding: 8px 10px;
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--t2);
    cursor: pointer;
    font-family: inherit;
    font-size: .85rem;
    font-weight: 700;
  }
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .sheet-footer {
    flex-shrink: 0;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--card);
    display: flex; gap: 10px;
  }
  .sheet-footer .btn { flex: 1; padding: 14px; }

  /* 記錄卡片可點 */
  .rec-card {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--rs);
    cursor: pointer;
    transition: background .12s;
  }
  .rec-card:active { background: var(--card2); }
  .rec-card .del-btn {
    flex-shrink: 0;
    padding: 8px 10px;
    background: transparent;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1.1rem;
    border-radius: 8px;
  }
  .rec-card .del-btn:active { background: rgba(244,63,94,.12); }

  /* drag handle */
  .sheet-drag {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: -2px auto 6px;
  }
</style>
</head>
<body>
<header class="hdr">
  <div><h1>🔒 私密記帳</h1><div class="hdr-sub">只有你看得到・不發任何通知</div></div>
  <a href="./settings.html" class="hdr-btn">⚙️</a>
</header>

<div class="w" style="padding-bottom:calc(var(--nav) + 90px)">

  <!-- 月份切換 + 統計 -->
  <div class="data-card" style="padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(244,63,94,.08));border:1px solid rgba(244,63,94,.2)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px">
      <button onclick="changeMonth(-1)" style="padding:8px 14px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;color:var(--t1);cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700">◀</button>
      <div style="text-align:center;flex:1">
        <div style="font-size:.7rem;color:var(--t3);margin-bottom:2px">📅 私密記錄</div>
        <div style="font-size:1.05rem;font-weight:900;color:var(--t)" id="priv-month-label">2026 年 5 月</div>
      </div>
      <button onclick="changeMonth(1)" id="priv-next-btn" style="padding:8px 14px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;color:var(--t1);cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:700">▶</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px dashed var(--border)">
      <div>
        <div style="font-size:.7rem;color:var(--t3);margin-bottom:2px">總額</div>
        <div style="font-size:1.3rem;font-weight:900;color:var(--t)" id="priv-month-total">$0</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:.7rem;color:var(--t3);margin-bottom:2px">筆數</div>
        <div style="font-size:1.1rem;font-weight:700;color:var(--t2)"><span id="priv-month-count">0</span> 筆</div>
      </div>
    </div>
  </div>

  <!-- 搜尋區 -->
  <div class="data-card" style="padding:12px 14px;margin-bottom:10px">
    <div style="position:relative;margin-bottom:8px">
      <input type="text" class="fc" id="priv-search" placeholder="🔍 搜尋明細、金額、卡片名稱..." style="padding-right:36px;font-size:.85rem">
      <button id="priv-search-clear" onclick="clearPrivSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);font-size:1.1rem;cursor:pointer;padding:4px">✕</button>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--t2);cursor:pointer;user-select:none">
      <input type="checkbox" id="priv-search-all" onchange="renderList()" style="cursor:pointer;width:16px;height:16px;accent-color:var(--p)">
      <span>跨所有月份搜尋</span>
      <span style="color:var(--t3);font-size:.7rem">（預設只搜當前月份）</span>
    </label>
    <div id="priv-search-result" style="display:none;margin-top:8px;padding:8px 10px;background:var(--pdim);border-radius:8px;font-size:.78rem;color:var(--p);font-weight:700"></div>
  </div>

  <!-- 提示文字（無記錄時隱藏） -->
  <div id="priv-list-hint" style="font-size:.72rem;color:var(--t3);margin:8px 4px 6px;display:none">💡 點記錄可編輯，右側 🗑 刪除</div>

  <!-- 記錄列表 -->
  <div id="priv-list"></div>
</div>

<!-- 浮動新增按鈕 -->
<button class="priv-fab" id="priv-fab" onclick="openAddSheet()" title="新增私密記帳">➕</button>

<!-- ════════════ Bottom Sheet：新增/編輯（共用）════════════ -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet-container" id="sheet-container">
  <div class="sheet-header">
    <button class="sheet-close-btn" onclick="closeSheet()">取消</button>
    <div class="sheet-header-title" id="sheet-title">新增私密記帳</div>
  </div>

  <div class="sheet-body">
    <div class="sheet-drag"></div>

    <!-- AI 文字 / 語音雙模式輸入（僅新增時顯示） -->
    <div id="sheet-ai-section" style="margin-bottom:14px">
      <div style="display:flex;gap:8px">
        <input type="text" class="fc" id="ai-input" placeholder="說話或輸入，例：今天買書 350 信用卡" style="flex:1;font-size:.85rem">
        <button id="ai-btn" onclick="submitAI()" style="padding:12px 16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#000;border:none;border-radius:var(--rs);font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap;min-width:80px">🎤 語音</button>
      </div>
      <div style="font-size:.7rem;color:var(--t3);margin-top:4px">空白按鈕變語音輸入，有文字按鈕變 AI 記帳</div>
      <div class="sh" style="margin-top:14px"></div>
    </div>

    <!-- 金額 + 日期 -->
    <div class="fg">
      <span class="flbl">💰 金額</span>
      <input type="number" class="fc" id="p-amt" placeholder="輸入金額" inputmode="numeric">
    </div>
    <div class="fg">
      <span class="flbl">📅 日期</span>
      <input type="date" class="fc" id="p-date">
    </div>

    <!-- 分類 -->
    <div class="fg">
      <span class="flbl">🏷️ 分類</span>
      <div class="cat-chips" id="cat-chips"></div>
    </div>

    <!-- 子分類 -->
    <div class="fg" id="sub-fg" style="display:none">
      <span class="flbl">📂 子分類（可略）</span>
      <select class="fc" id="sub-sel"><option value="">請選擇</option></select>
    </div>

    <!-- 明細 -->
    <div class="fg">
      <span class="flbl">📝 明細（可略）</span>
      <input type="text" class="fc" id="p-detail" placeholder="例：書展購書" maxlength="50">
    </div>

    <!-- 付款方式 -->
    <div class="fg">
      <span class="flbl">💳 付款方式</span>
      <div class="tg" style="flex-wrap:wrap;gap:8px">
        <button class="tb on" id="pay-cash"  onclick="setPay('cash',this)"  style="flex:none;padding:12px 16px">💵 現金</button>
        <button class="tb"    id="pay-card"  onclick="setPay('card',this)"  style="flex:none;padding:12px 16px">💳 信用卡</button>
        <button class="tb"    id="pay-icard" onclick="setPay('icard',this)" style="flex:none;padding:12px 16px">🎫 悠遊卡</button>
        <button class="tb"    id="pay-acct"  onclick="setPay('acct',this)"  style="flex:none;padding:12px 16px">🏦 帳戶</button>
      </div>
    </div>

    <!-- 卡片/帳戶選擇 -->
    <div class="fg" id="card-fg" style="display:none">
      <span class="flbl">🃏 選擇信用卡</span>
      <div class="card-chips" id="card-chips"></div>
      <div id="no-card-hint" style="display:none;font-size:.78rem;color:var(--warn);margin-top:6px">⚠️ 尚未設定信用卡，請至<a href="./wallet.html" style="color:var(--p)">錢包頁</a>新增</div>
    </div>
    <div class="fg" id="icard-fg" style="display:none">
      <span class="flbl">🎫 選擇悠遊卡</span>
      <div class="card-chips" id="icard-chips"></div>
      <div id="no-icard-hint" style="display:none;font-size:.78rem;color:var(--warn);margin-top:6px">⚠️ 尚未設定悠遊卡，請至<a href="./wallet.html" style="color:var(--p)">錢包頁</a>新增</div>
    </div>
    <div class="fg" id="acct-fg" style="display:none">
      <span class="flbl">🏦 選擇帳戶</span>
      <div class="card-chips" id="acct-chips"></div>
      <div id="no-acct-hint" style="display:none;font-size:.78rem;color:var(--warn);margin-top:6px">⚠️ 尚未設定銀行帳戶，請至<a href="./wallet.html" style="color:var(--p)">錢包頁</a>新增</div>
    </div>
  </div>

  <div class="sheet-footer">
    <button class="btn btn-p" onclick="submitFromSheet()" id="sheet-submit-btn">🔒 確定記錄</button>
  </div>
</div>

<script>
// ===========================================================================
// 私密記帳 v3 - 列表優先設計 + Bottom Sheet 編輯/新增
// 隔離保證（不變）：
//   1. 所有寫入走 addPrivTx / fbAddPrivTx
//   2. tx.private = true 標記
//   3. tx.person = '宏龍' 寫死
//   4. 不發 Discord、不更新預算
// ===========================================================================

// ── 表單狀態（共用新增/編輯）──
let formMode  = 'add';   // 'add' or 'edit'
let editingId = '';      // 編輯時的 tx.id

let curCat   = '';
let curSubCat= '';
let curPay   = 'cash';
let curCardId  = null;
let curIcardId = null;
let curAcctId  = null;

// ── 列表瀏覽狀態 ──
let viewYear  = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1;
let searchQuery = '';

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

// ─────────────────────────────────────────────────────────
// 🎤 語音輸入
// ─────────────────────────────────────────────────────────
let voiceRec = null;

function startVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('此裝置不支援語音，請直接輸入文字', 'warn');
    document.getElementById('ai-input').focus();
    return;
  }
  if (voiceRec) { try { voiceRec.stop(); } catch {} voiceRec = null; return; }
  const btn = document.getElementById('ai-btn');
  const recognition = new SR();
  recognition.lang = 'zh-TW';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = () => {
    voiceRec = recognition;
    btn.textContent = '🔴 聆聽';
    btn.style.background = 'rgba(244,63,94,.15)';
    btn.style.color = 'var(--danger)';
    toast('聆聽中…說完會自動送出', 'info');
  };
  recognition.onresult = (e) => {
    document.getElementById('ai-input').value = e.results[0][0].transcript;
    voiceRec = null;
    resetAiBtn();
    submitAI();
  };
  recognition.onerror = (e) => {
    voiceRec = null;
    resetAiBtn();
    if (e.error === 'aborted') return;
    const errMap = {'not-allowed':'請允許麥克風權限','no-speech':'沒有偵測到聲音','network':'網路問題','audio-capture':'麥克風無法使用'};
    toast(errMap[e.error] || `語音辨識失敗(${e.error})`, 'err');
  };
  recognition.onend = () => { if (voiceRec) { voiceRec = null; resetAiBtn(); } };
  recognition.start();
}

function resetAiBtn() {
  const btn = document.getElementById('ai-btn');
  const inp = document.getElementById('ai-input');
  btn.style.background = 'linear-gradient(135deg,var(--p),var(--p2))';
  btn.style.color = '#000';
  btn.textContent = inp.value.trim() ? 'AI 記帳' : '🎤 語音';
}

async function submitAI() {
  const text = document.getElementById('ai-input').value.trim();
  if (!text) { startVoiceInput(); return; }
  const btn = document.getElementById('ai-btn');
  btn.textContent = '解析中…'; btn.disabled = true;
  try {
    const key = localStorage.getItem('claude_api_key') || '';
    if (!key) { toast('請先在設定頁填入 Claude API Key','err'); return; }
    const cats = getCats().map(c => `${c.id}(${c.name})`).join(', ');
    const todayStr = (typeof toLocalISO === 'function') ? toLocalISO() : new Date().toISOString().slice(0,10);
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const yestStr = (typeof toLocalISO === 'function') ? toLocalISO(yest) : yest.toISOString().slice(0,10);
    const prompt = `你是私密記帳助理。從這段文字提取記帳資訊並回傳純 JSON（不要 markdown）。
今天:${todayStr} 昨天:${yestStr}
可用分類(id:名稱): ${cats}
付款方式選項: cash(現金)/card(信用卡)/icard(悠遊卡)/acct(帳戶)。預設 cash。
文字:「${text}」
回傳純JSON:{"amount":數字,"cat":"分類id","detail":"說明","date":"YYYY-MM-DD","pay":"cash/card/icard/acct"}`;
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:'claude-haiku-4-5',max_tokens:512,messages:[{role:'user',content:prompt}]})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    let clean = (data.content?.[0]?.text||'').trim();
    if (clean.includes('```json')) clean = clean.split('```json')[1].split('```')[0];
    else if (clean.includes('```')) clean = clean.split('```')[1].split('```')[0];
    const r = JSON.parse(clean.trim());

    if (r.amount > 0) document.getElementById('p-amt').value = r.amount;
    if (r.detail) document.getElementById('p-detail').value = r.detail;
    if (r.date) {
      const parts = r.date.replace(/[\/\.]/g,'-').split('-');
      if (parts.length===3) {
        document.getElementById('p-date').value = `${parts[0].padStart(4,'0')}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
      }
    }
    if (r.cat) {
      const chip = document.querySelector(`#cat-chips .cchip[data-id="${r.cat}"]`);
      if (chip) selCat(r.cat, chip);
    }
    if (r.pay && ['cash','card','icard','acct'].includes(r.pay)) {
      const payBtn = document.getElementById('pay-'+r.pay);
      if (payBtn) setPay(r.pay, payBtn);
    }
    document.getElementById('ai-input').value = '';
    resetAiBtn();
    toast('✅ AI 解析完成，請確認後按記錄', 'info');
  } catch(e) {
    const msg = e.message||'';
    if (msg.includes('Failed to fetch')) toast('📶 網路受限，請檢查連線', 'err');
    else toast('AI 解析失敗：'+msg, 'err');
  } finally {
    document.getElementById('ai-btn').disabled = false;
    resetAiBtn();
  }
}

// ─────────────────────────────────────────────────────────
// 🏷️ 分類 chip 渲染
// ─────────────────────────────────────────────────────────
function buildCatChips() {
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = '';
  getCats().forEach(c => {
    const b = document.createElement('button');
    b.className = 'cchip' + (c.id === curCat ? ' on' : '');
    b.dataset.id = c.id;
    b.style.borderColor = c.color;
    b.innerHTML = `<span style="color:${c.color}">●</span> ${c.name}`;
    b.onclick = () => selCat(c.id, b);
    wrap.appendChild(b);
  });
}

function selCat(catId, btn) {
  curCat = catId;
  curSubCat = '';
  document.querySelectorAll('#cat-chips .cchip').forEach(el => el.classList.remove('on'));
  btn.classList.add('on');
  buildSubSel();
}

function buildSubSel() {
  const cat = catFind(curCat);
  const sub = cat?.sub || [];
  const fg  = document.getElementById('sub-fg');
  const sel = document.getElementById('sub-sel');
  if (!sub.length) { fg.style.display = 'none'; return; }
  fg.style.display = 'block';
  sel.innerHTML = '<option value="">請選擇</option>';
  sub.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
  sel.value = curSubCat || '';
  sel.onchange = () => { curSubCat = sel.value; };
}

// ─────────────────────────────────────────────────────────
// 💳 付款方式切換
// ─────────────────────────────────────────────────────────
function setPay(pay, btn) {
  curPay = pay;
  document.querySelectorAll('#pay-cash,#pay-card,#pay-icard,#pay-acct').forEach(el => el.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('card-fg').style.display  = (pay === 'card')  ? 'block' : 'none';
  document.getElementById('icard-fg').style.display = (pay === 'icard') ? 'block' : 'none';
  document.getElementById('acct-fg').style.display  = (pay === 'acct')  ? 'block' : 'none';
  if (pay === 'card')  buildCardChips();
  if (pay === 'icard') buildIcardChips();
  if (pay === 'acct')  buildAcctChips();
}

function buildCardChips() {
  const wrap = document.getElementById('card-chips');
  const hint = document.getElementById('no-card-hint');
  wrap.innerHTML = '';
  const cards = getCards();
  if (!cards.length) { hint.style.display = 'block'; return; }
  hint.style.display = 'none';
  cards.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cchip' + (c.id === curCardId ? ' on' : '');
    b.innerHTML = `🃏 ${c.name}`;
    b.onclick = () => {
      curCardId = c.id;
      document.querySelectorAll('#card-chips .cchip').forEach(el => el.classList.remove('on'));
      b.classList.add('on');
    };
    wrap.appendChild(b);
  });
  if (cards.length && !curCardId) {
    curCardId = cards[0].id;
    wrap.firstChild.classList.add('on');
  }
}
function buildIcardChips() {
  const wrap = document.getElementById('icard-chips');
  const hint = document.getElementById('no-icard-hint');
  wrap.innerHTML = '';
  const icards = getIcards();
  if (!icards.length) { hint.style.display = 'block'; return; }
  hint.style.display = 'none';
  icards.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cchip' + (c.id === curIcardId ? ' on' : '');
    b.innerHTML = `🎫 ${c.name} (餘 $${c.balance||0})`;
    b.onclick = () => {
      curIcardId = c.id;
      document.querySelectorAll('#icard-chips .cchip').forEach(el => el.classList.remove('on'));
      b.classList.add('on');
    };
    wrap.appendChild(b);
  });
  if (icards.length && !curIcardId) {
    curIcardId = icards[0].id;
    wrap.firstChild.classList.add('on');
  }
}
function buildAcctChips() {
  const wrap = document.getElementById('acct-chips');
  const hint = document.getElementById('no-acct-hint');
  wrap.innerHTML = '';
  const accts = (typeof getAccts === 'function') ? getAccts(false) : [];
  if (!accts.length) { hint.style.display = 'block'; return; }
  hint.style.display = 'none';
  accts.forEach(a => {
    const b = document.createElement('button');
    b.className = 'cchip' + (a.id === curAcctId ? ' on' : '');
    b.innerHTML = `🏦 ${a.name}`;
    b.onclick = () => {
      curAcctId = a.id;
      document.querySelectorAll('#acct-chips .cchip').forEach(el => el.classList.remove('on'));
      b.classList.add('on');
    };
    wrap.appendChild(b);
  });
  if (accts.length && !curAcctId) {
    curAcctId = accts[0].id;
    wrap.firstChild.classList.add('on');
  }
}

// ─────────────────────────────────────────────────────────
// 📋 Bottom Sheet 開關 + 模式切換
// ─────────────────────────────────────────────────────────
function openAddSheet() {
  formMode = 'add';
  editingId = '';
  // 重置表單
  curCat = '';
  curSubCat = '';
  curPay = 'cash';
  curCardId = null;
  curIcardId = null;
  curAcctId = null;
  document.getElementById('sheet-title').textContent = '新增私密記帳';
  document.getElementById('sheet-submit-btn').textContent = '🔒 確定記錄';
  document.getElementById('sheet-ai-section').style.display = 'block';
  document.getElementById('p-amt').value = '';
  document.getElementById('p-detail').value = '';
  document.getElementById('p-date').value = (typeof toLocalISO === 'function') ? toLocalISO() : new Date().toISOString().slice(0,10);
  document.getElementById('ai-input').value = '';
  document.querySelectorAll('#pay-cash,#pay-card,#pay-icard,#pay-acct').forEach(el => el.classList.remove('on'));
  document.getElementById('pay-cash').classList.add('on');
  document.getElementById('card-fg').style.display = 'none';
  document.getElementById('icard-fg').style.display = 'none';
  document.getElementById('acct-fg').style.display = 'none';
  document.getElementById('sub-fg').style.display = 'none';
  buildCatChips();
  showSheet();
}

function openEditSheet(id) {
  const tx = getPrivTx().find(t => t.id === id);
  if (!tx) return;
  formMode = 'edit';
  editingId = id;
  curCat    = tx.cat;
  curSubCat = tx.subCat || '';
  curPay    = tx.pay || 'cash';
  curCardId  = tx.cardId  || null;
  curIcardId = tx.icardId || null;
  curAcctId  = tx.acctId  || null;
  document.getElementById('sheet-title').textContent = '編輯私密記錄';
  document.getElementById('sheet-submit-btn').textContent = '💾 儲存變更';
  document.getElementById('sheet-ai-section').style.display = 'none';  // 編輯時不顯示 AI 區
  document.getElementById('p-amt').value = tx.amount;
  document.getElementById('p-detail').value = tx.detail || '';
  document.getElementById('p-date').value = (typeof toLocalISO === 'function') ? toLocalISO(new Date(tx.at)) : new Date(tx.at).toISOString().slice(0,10);
  // 付款方式按鈕
  document.querySelectorAll('#pay-cash,#pay-card,#pay-icard,#pay-acct').forEach(el => el.classList.remove('on'));
  const payBtn = document.getElementById('pay-' + curPay);
  if (payBtn) payBtn.classList.add('on');
  // 卡片區顯示
  document.getElementById('card-fg').style.display  = curPay === 'card'  ? 'block' : 'none';
  document.getElementById('icard-fg').style.display = curPay === 'icard' ? 'block' : 'none';
  document.getElementById('acct-fg').style.display  = curPay === 'acct'  ? 'block' : 'none';
  if (curPay === 'card')  buildCardChips();
  if (curPay === 'icard') buildIcardChips();
  if (curPay === 'acct')  buildAcctChips();
  buildCatChips();
  buildSubSel();
  showSheet();
}

function showSheet() {
  document.getElementById('sheet-overlay').classList.add('show');
  // 用 requestAnimationFrame 讓動畫順暢
  document.getElementById('sheet-container').style.display = 'flex';
  requestAnimationFrame(() => {
    document.getElementById('sheet-container').classList.add('show');
  });
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  const container = document.getElementById('sheet-container');
  container.classList.remove('show');
  document.getElementById('sheet-overlay').classList.remove('show');
  document.body.style.overflow = '';
  // 動畫結束才隱藏
  setTimeout(() => { container.style.display = 'none'; }, 250);
}

// ─────────────────────────────────────────────────────────
// ✅ 送出（新增 or 編輯）
// ─────────────────────────────────────────────────────────
function submitFromSheet() {
  const amt = parseInt(document.getElementById('p-amt').value) || 0;
  if (!amt)     { toast('請輸入金額','warn'); return; }
  if (!curCat)  { toast('請選擇分類','warn'); return; }
  if (curPay === 'card'  && !curCardId)  { toast('請選擇信用卡','warn'); return; }
  if (curPay === 'icard' && !curIcardId) { toast('請選擇悠遊卡','warn'); return; }
  if (curPay === 'acct'  && !curAcctId)  { toast('請選擇帳戶','warn'); return; }

  const detail = document.getElementById('p-detail').value.trim();
  const date   = document.getElementById('p-date').value;
  const [yyyy,mm,dd] = date.split('-').map(Number);
  const data = {
    amount:  amt,
    cat:     curCat,
    subCat:  curSubCat || '',
    detail,
    pay:     curPay,
    cardId:  curPay === 'card'  ? curCardId  : null,
    icardId: curPay === 'icard' ? curIcardId : null,
    acctId:  curPay === 'acct'  ? curAcctId  : null,
    at:      new Date(yyyy, mm-1, dd, 12, 0, 0).toISOString(),
  };
  if (formMode === 'add') {
    data.person = '宏龍';
    data.private = true;
    addPrivTx(data);
    fbAddPrivTx(data);
    toast('🔒 已記錄');
  } else {
    editPrivTx(editingId, data);
    fbEditPrivTx(editingId, data);
    toast('💾 已更新');
  }
  closeSheet();
  renderList();
  renderStats();
}

// ─────────────────────────────────────────────────────────
// 📅 月份切換
// ─────────────────────────────────────────────────────────
function changeMonth(delta) {
  const now = new Date();
  let ty = viewYear, tm = viewMonth + delta;
  if (tm > 12) { ty++; tm = 1; }
  if (tm < 1)  { ty--; tm = 12; }
  if (ty > now.getFullYear() || (ty === now.getFullYear() && tm > now.getMonth() + 1)) return;
  viewYear = ty; viewMonth = tm;
  renderStats();
  renderList();
}

// ─────────────────────────────────────────────────────────
// 🔍 搜尋
// ─────────────────────────────────────────────────────────
function clearPrivSearch() {
  document.getElementById('priv-search').value = '';
  searchQuery = '';
  document.getElementById('priv-search-clear').style.display = 'none';
  renderList();
}

// 取得卡片/帳戶名稱（給搜尋用）
function payNameForSearch(t) {
  if (t.pay === 'cash')  return '現金';
  if (t.pay === 'card')  {
    const card = getCards().find(c => c.id === t.cardId);
    return '信用卡 ' + (card ? card.name : '');
  }
  if (t.pay === 'icard') {
    const ic = getIcards().find(c => c.id === t.icardId);
    return '悠遊卡 ' + (ic ? ic.name : '');
  }
  if (t.pay === 'acct')  {
    const ac = (typeof getAccts === 'function') ? getAccts(false).find(a => a.id === t.acctId) : null;
    return '帳戶 ' + (ac ? ac.name : '');
  }
  return '';
}

// ─────────────────────────────────────────────────────────
// 💡 統計與列表
// ─────────────────────────────────────────────────────────
function renderStats() {
  document.getElementById('priv-month-label').textContent = `${viewYear} 年 ${viewMonth} 月`;
  const now = new Date();
  const isCurrent = viewYear === now.getFullYear() && viewMonth === now.getMonth() + 1;
  const nextBtn = document.getElementById('priv-next-btn');
  if (isCurrent) {
    nextBtn.style.opacity = '.3';
    nextBtn.style.cursor = 'not-allowed';
  } else {
    nextBtn.style.opacity = '1';
    nextBtn.style.cursor = 'pointer';
  }
  const list = getPrivTx().filter(t => {
    const d = new Date(t.at);
    return d.getFullYear() === viewYear && d.getMonth() + 1 === viewMonth;
  });
  const total = list.reduce((s,t) => s + Number(t.amount||0), 0);
  document.getElementById('priv-month-total').textContent = '$' + total.toLocaleString('zh-TW');
  document.getElementById('priv-month-count').textContent = list.length;
}

function payLabel(t) {
  if (t.pay === 'cash')  return '💵 現金';
  if (t.pay === 'card')  {
    const card = getCards().find(c => c.id === t.cardId);
    return '💳 ' + (card ? card.name : '信用卡');
  }
  if (t.pay === 'icard') {
    const ic = getIcards().find(c => c.id === t.icardId);
    return '🎫 ' + (ic ? ic.name : '悠遊卡');
  }
  if (t.pay === 'acct')  {
    const ac = (typeof getAccts === 'function') ? getAccts(false).find(a => a.id === t.acctId) : null;
    return '🏦 ' + (ac ? ac.name : '帳戶');
  }
  return '💵 現金';
}

function renderList() {
  const all = getPrivTx();
  const searchAll = document.getElementById('priv-search-all')?.checked || false;
  searchQuery = (document.getElementById('priv-search')?.value || '').trim();
  document.getElementById('priv-search-clear').style.display = searchQuery ? 'block' : 'none';

  // 月份篩選
  let list;
  const useCrossMonth = searchAll && searchQuery;
  if (useCrossMonth) {
    list = all;
  } else {
    list = all.filter(t => {
      const d = new Date(t.at);
      return d.getFullYear() === viewYear && d.getMonth() + 1 === viewMonth;
    });
  }

  // 搜尋
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(t =>
      (t.detail||'').toLowerCase().includes(q) ||
      (catFind(t.cat).name||'').toLowerCase().includes(q) ||
      (t.subCat||'').toLowerCase().includes(q) ||
      payNameForSearch(t).toLowerCase().includes(q) ||
      String(t.amount).includes(q)
    );
  }

  // 搜尋合計
  const resultBox = document.getElementById('priv-search-result');
  if (searchQuery) {
    const sum = list.reduce((s,t) => s + Number(t.amount||0), 0);
    const scope = useCrossMonth ? '全部月份' : `${viewYear}年${viewMonth}月`;
    resultBox.style.display = 'block';
    resultBox.innerHTML = `🔍 在「${scope}」找到 <b>${list.length}</b> 筆，合計 <b>$${sum.toLocaleString('zh-TW')}</b>`;
  } else {
    resultBox.style.display = 'none';
  }

  // 列表
  const hint = document.getElementById('priv-list-hint');
  const root = document.getElementById('priv-list');
  if (!list.length) {
    hint.style.display = 'none';
    const msg = searchQuery
      ? `<div style="font-size:3rem;margin-bottom:12px">🔍</div><div>找不到符合的記錄</div><div style="font-size:.78rem;color:var(--t3);margin-top:8px">${useCrossMonth ? '已搜尋全部月份' : '試試勾選「跨所有月份搜尋」'}</div>`
      : `<div style="font-size:3rem;margin-bottom:12px">📭</div><div>${viewYear}年${viewMonth}月尚無私密記錄</div><div style="font-size:.78rem;color:var(--t3);margin-top:8px">點右下角 ➕ 開始記錄</div>`;
    root.innerHTML = `<div class="data-card" style="padding:40px 20px;text-align:center;color:var(--t3)">${msg}</div>`;
    return;
  }
  hint.style.display = 'block';
  list.sort((a,b) => new Date(b.at) - new Date(a.at));
  root.innerHTML = list.map(t => {
    const cat = catFind(t.cat);
    const dStr = fmtD(t.at);
    const sub  = t.subCat ? `<span style="color:var(--t3);font-size:.72rem">・${t.subCat}</span>` : '';
    return `
    <div class="rec-card" onclick="openEditSheet('${t.id}')">
      <div style="font-size:1.4rem">${cat.icon || '🏷️'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;color:var(--t)">$${Number(t.amount).toLocaleString('zh-TW')}<span style="color:${cat.color};font-size:.78rem;margin-left:8px">${cat.name}</span>${sub}</div>
        <div style="font-size:.74rem;color:var(--t3);margin-top:2px">${dStr}・${payLabel(t)}${t.detail ? '・' + t.detail : ''}</div>
      </div>
      <button class="del-btn" onclick="event.stopPropagation();delRecord('${t.id}')" title="刪除">🗑️</button>
    </div>`;
  }).join('');
}

function delRecord(id) {
  if (!confirm('確定刪除這筆私密記錄？')) return;
  delPrivTx(id);
  fbDelPrivTx(id);
  renderList();
  renderStats();
  toast('已刪除');
}

// ─────────────────────────────────────────────────────────
// 🎤 AI 按鈕標題動態切換 + 搜尋 debounce
// ─────────────────────────────────────────────────────────
document.getElementById('ai-input').addEventListener('input', () => {
  const inp = document.getElementById('ai-input');
  const btn = document.getElementById('ai-btn');
  btn.textContent = inp.value.trim() ? 'AI 記帳' : '🎤 語音';
});
document.getElementById('ai-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitAI(); }
});

let _searchDebounceTimer = null;
document.getElementById('priv-search').addEventListener('input', () => {
  clearTimeout(_searchDebounceTimer);
  _searchDebounceTimer = setTimeout(() => renderList(), 250);
});
document.getElementById('priv-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(_searchDebounceTimer); renderList(); }
});

// Esc 關閉 sheet
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('sheet-container').classList.contains('show')) {
    closeSheet();
  }
});
